<script>
const DATA = {"chapters": [{"title": "Os descobrimentos portuguezes e os de Colombo/I", "url": "https://pt.wikisource.org/wiki/Os_descobrimentos_portuguezes_e_os_de_Colombo/I", "paras": [{"t": "h", "text": "Os problemas geographicos do seculo XV"}, {"t": "p", "text": "A festa do centenario de Colombo deve acima de tudo ser uma festa de justiça e um dos grandes jubileus da humanidade. Os centenarios dos grandes homens e os centenarios dos grandes acontecimentos são as solemnidades com que se festeja sobretudo a chegada a cada um dos marcos milliarios da estrada, que até agora parece ser infinita, do Progresso. Lançando os olhos para o passado, vê-se que a humanidade não parou um só instante na sua marcha para um fim ainda hoje desconhecido. Parece ás vezes aos observadores superficiaes que ha epochas em que se recúa, porque se extingue uma luz que brilhava com immensa intensidade, ou porque retrocede uma ou outra das legiões que formam o immenso exercito da especie humana; mas, se ha umas que retrocedem, porque estavam muito adeante das outras, estas em compensação avançam e ganham o terreno perdido pelos seus companheiros de jornada. Se um clarão se apaga, outros ha que se accendem em pontos que até ahi estavam immersos em trevas profundas. O nivel da humanidade restabelece-se como se restabelece o nivel das aguas depois dos grandes cataclysmos que afundam as mais altas montanhas, e que deixam enxutas immensas planicies cobertas até ahi pela vaga. Assim não ha um só dos grandes cataclysmos historicos de que não resultasse um progresso. Mudou-se a fórma da civilisação occidental quando cahiu o imperio romano. Ao impulso dos barbaros alluiram-se as instituições e os monumentos, a sciencia e as lettras eclipsaram-se, mas a alma humana illuminou-se com a irradiação do Evangelho que só n’essa raça virgem que vinha do Norte e do Oriente podia accender os candidos explendores que foram como que novas estrellas no nosso firmamento moral, que foram a divinisação da mulher e a apotheose da familia e ao mesmo tempo a esperança immortal que expirára no mundo antigo podre de civilisação e que reviveu no mundo barbaro. Cahiam deante do alvião vandalico os monumentos magestosos de Roma e as puras obras primas da Grecia, mas erguia-se envolta n’um nimbo estranho de fé e de poesia a cathedral gothica, e recortavam-se em mil caprichos phantasticos as torrinhas e as innumeraveis agulhas dos paços municipaes, em que a burguezia ostentava, em frente da realeza da espada, a realeza do trabalho. Desappareciam debaixo dos codices monachaes as obras primas dos tragicos e as epopéas gregas, mas a alma complexa da tumultuosa meia edade palpitava nos tercetos de Dante. E, quando a invasão musulmana derrubava no Oriente o ultimo baluarte da antiguidade erudita, quando a Grecia via os seus marmores despedaçados pelas ferraduras dos cavallos do deserto, e o Egypto as suas esphinges sepultadas nas nuvens de areia que as hordas arabes levantavam, no Occidente arrancava Colombo á esphinge do Oceano o seu segredo secular, fixava para sempre Guttemberg os vestigios do pensamento humano, e ás portas orientaes, vindas de remoto occaso, assomavam as prôas das caravelas portuguezas, que acabavam de sulcar, vanguarda da civilisação, as ondas do mar Tenebroso illuminadas pela sua audacia."}, {"t": "p", "text": "Estas festas devem ser porém acima de tudo as festas da justiça, porque n’ellas devem emmudecer perante a grande causa da humanidade as mesquinhas invejas, as pequeninas rivalidades nacionaes, com que por muitas vezes se procura deslustrar a memoria d’aquelles, que foram os agentes providenciaes d’estas grandes transformações. O progresso humano obedece a leis de uma ineluctavel logica. Não ha saltos nem lacúnas. Tudo se succede com uma logica surprehendente. As grandes descobertas derivam-se umas das outras. Todo o grande homem tem os seus humildes predecessores. O seu genio fórma-se com elementos dispersos que elle aproveita, concatena, e de que tira só elle o resultado fecundo. Não foi Watt que inventou a machina de vapor, mas a elle e só a elle cabe a gloria do invento, porque foi o seu genio que encontrou o segredo capital, sem o qual essa machina não seria sempre senão uma curiosidade, inutil para os grandes progressos da sciencia e da industria. Não foi Colombo sem duvida o primeiro que sonhou que para além das vagas do Atlantico se encontrava terra, nem o primeiro que devaneou que a marcha de um navio pelo occidente o deveria conduzir ás plagas orientaes da Asia. Não foi o infante D. Henrique o primeiro que pensou que, torneando a Africa, se poderia chegar ao mar Roxo e á India, mas foram Colombo e o infante D. Henrique que tiveram a audacia, a fé e o espirito scientifico, foram elles que romperam os obstaculos, deante dos quaes recuava pallida e tremente a multidão dos navegantes, ou refugia hesitante o sonho de alguns capitães devaneadores. A elles cabe sem duvida a gloria incontestavel, perante elles se deve curvar com respeito a humanidade, que só a elles deve a conquista maravilhosa de mais de metade da terra."}, {"t": "p", "text": "Quando vejo a azafama com que procuram ainda hoje espiritos demolidores sustentar que os Portuguezes foram precedidos por outros povos nos seus descobrimentos, que teve Colombo predecessores no descobrimento da America, pasmo que se não veja claramente o obstaculo deante do qual baqueiam todos os seus argumentos. Esse obstaculo é o seguinte: antes dos navegadores do infante D. Henrique terem demonstrado o contrario, era ponto incontestavel para todos a impossibilidade de se viver na zona torrida. Antes de Colombo ter mostrado o contrario, era ponto incontroverso que a immensa extensão do Atlantico tornava impossivel que um navio, caminhando na direcção do occidente, encontrasse terra antes de terem perecido de fome e de sede todas as tripulações. Pois, se um navio qualquer tivesse, como se diz dos navios dieppezes, chegado antes de nós ás costas da Guiné, não estava desde logo quebrado o encanto, não cahia por terra toda a geographia systematica dos antigos, não estava aberto para sempre o mare clausum, e podia alguem sustentar ainda que era inhabitavel a zona torrida, quando havia em França marinheiros que a tinham atravessado sem perigo, que tinham voltado incolumes, deixando n’essas regiões que todos diziam completamente queimadas pelo sol colonias florescentes como esse Petit-Dieppe e esse Petit-Paris, que ainda hoje são citadas por escriptores francezes notabilissimos, em cujo espirito um mal-entendido amor patrio parece extinguir completamente a faculdade do raciocinio? Seria necessario que essa descoberta fosse completamente inconsciente, que os marinheiros nem soubessem que tinham entrado na zona torrida, e essa ignorancia é completamente incompativel com os conhecimentos embora rudimentares que precisava de ter o navegador que se arriscava a tão aventurosas viagens."}, {"t": "p", "text": "O mesmo diremos das navegações antigas de que se encontra noticia nos livros de Herodoto e no Periplo de Hannon. Se os marinheiros phenicios de Necho tivessem dado volta ao cabo da Boa Esperança, e tivessem entrado no Mediterraneo pelo estreito de Gibraltar, percorrendo tão immensa extensão de costas, como poderiam persistir no espirito dos geographos antigos idéas tão absolutamente falsas a respeito da configuração da Africa e da distribuição das zonas? Pode allegar-se por acaso que essa viagem não deixou vestigios, quando vemos que as viagens dos Phenicios nos mares da Europa tão difficeis e tão inhospitos foram sempre continuadas, que nunca se perdeu o conhecimento da Islandia, essa terra gelada, e que pelo contrario perderam immediatamente esses Phenicios, esses Orientaes, que viviam nas terras ardentes, o conhecimento de costas que o sol tambem aquecia e em que encontravam muitas vezes como que a reproducção das suas terras nataes? E não seria extranho tambem que Hannon tivesse feito a longa viagem que do seu Periplo se quer deduzir que fez, e que se apagasse completamente na memoria carthagineza o conhecimento das terras percorridas em tão memoravel expedição, preferindo tambem, ao que parece, esses filhos de paiz africano, as costas geladas e os mares tempestuosos da Europa ao clima quente e ao mar sereno da Africa Occidental?"}, {"t": "p", "text": "O que é estranho realmente, é que o alto espirito de Humboldt acceitasse sem exame as pretenções dos Normandos, limitando-se a observar na sua Historia da geographia do Novo Continente que esses factos citados não diminuem a gloria de quem tentou a exploração seguida das costas africanas!Não viu o grande historiador, o immortal geographo, que esses factos isolados bastavam para destruir todas as lendas, que eram a chave com que ficava para sempre aberto o mar Tenebroso, que só se abriu comtudo radiante de luz deante dos esforços dos navegadores portuguezes, que bastavam para abrir o caminho para a terra antichtona, para o alter orbis, onde muitos diziam que ficava situado o Paraizo Terrestre, e que nós não poderiamos conhecer nunca, porque ás duas zonas temperadas se interpunha, intransitavel e terrivel, a zona torrida completamente queimada pelo sol? Tão profunda seria a ignorancia em Dieppe que ninguem visse a importancia da maravilhosa expedição? Nos seculos XIII e XIV, sobretudo, em que já começava a actuar nos espiritos europeus a febre das viagens, já depois de Marco Polo ter escripto a sua curiosa narrativa, depois das viagens para o Oriente de Rubruquis e de Carpino, e das viagens de sir John Mandeville, quasi um normando tambem? Ninguem via semelhante coisa! Tendo de casa quem lhes ensinasse a verdade, continuavam geographos e cartographos, todos os sabios, todos os estudiosos a repetir as velhas fabulas, a encher de monstros horrificos os desconhecidos plainos africanos, a pintar a vermelho nos mappas, para bem indicar o ardor do clima, os mares equatoriaes? Possuindo colonias na costa africana, tendo marinheiros que tão bem conheciam esses mares podiam os reis de França consentir que, por bulla de 8 de janeiro de 1454, o papa Nicolau V concedesse aos reis de Portugal «todas as conquistas da Africa com as ilhas nos mares adjacentes desde o cabo Bojador e de Não até toda a Guiné com toda a sua costa meridional?». E era possivel ainda que no principio do seculo XV os capellães de João de Bethencourt, fidalgo normando que occupára as Canarias, compondo a narrativa da famosa expedição, nem uma palavra escrevessem ácerca das expedições dos seus patricios, e que pelo contrario dissessem, elles normandos, que «si aucun noble prince du royaume de France ou d’ailleurs vouloit entreprendre aucune grande conqueste par deçà, qui seroit une chose bien faisable et bien raisonnable, le pourroit faire à peu de frais; car Portugal et Espagne et Aragon les fourniroient pour leur argent de toutes vitoailles et de navires plus que nul autre pays, et aussi de pilotes qui savent les ports et les contrées?» Com tanta superficialidade porém se estudam estes assumptos que nem se pensa em se saber se a Guiné do seculo XIV é a Guiné posterior aos descobrimentos. Isso leva escriptores francezes e o proprio Humboldt a allegar que este mesmo Bethencourt explorou a Guiné antes dos portuguezes, sem verem que o que os seus capellães contam é o seguinte: que «os navegantes normandos se affogaram nas costas da Barbaria ao pé de Marrocos», e que Bethencourt tencionava visitar a parte da «terra firme que fica entre o cabo Cantim e o Bojador»que para isso consultara o livro de um religioso hespanhol «que visitára a Guiné, mas que, chegando ao cabo Bojador se limitára a reconhecer as ilhas que ficavam áquem». A Guiné do tempo de Bethencourt era, como se vê, a que ficava para cá do cabo Bojador, e tanto assim que o papa Innocencio VII disse, escrevendo a Bethencourt, que sabia ficarem as ilhas Canarias a doze leguas de Guiné. Que immenso cuidado é necessario, quando se procura destruir uma tradição profundamente e fortemente documentada! Quantas causas de erro escapam ao investigador ou frivolo, ou negligente, que se ufana de encontrar n’um velho alfarrabio um facto que vem destruir completamente o que parecia assente e demonstrado! Basta uma variação de nome para transtornar todas as deducções. Basta que uns não saibam, que outros não reparem que o nome de Guiné foi mudando de sitio, como outros muitos nomes geographicos, á medida que os descobrimentos foram caminhando, para que todas as interpretações caiam por terra! Não basta que se diga que no seculo XIV ou XV houve Francezes que chegaram á Guiné, torna-se indispensavel apurar tambem se a Guiné do principio do seculo XV era a mesma que assim se denominou depois dos descobrimentos. Este apuramento, d’onde resulta sabermos que a Guiné ficava, para os capellães de Bethencourt, áquem do cabo Bojador, destruiria completamente a singularissima reivindicação franceza se tantos argumentos fortissimos não houvesse para lhe demonstrar a inanidade. É o que succede tambem com os detractores de Colombo. Não vêem immediatamente os que dizem que antes de Colombo chegaram a terras americanas João Vaz Côrte Real, ou o francez Jean Cousin, que, se algum d’elles tivesse levado a termo tão importante expedição, bastava isso para ficar logo resolvido o grande problema do fim do seculo XV que trazia preoccupados sabios e estudiosos, deante do qual tanto hesitou D. João II, que inflammou em França o animo do cardeal Pedro d’Ailly, em Italia o do famoso Toscanelli! Com que jubilo se saudaria essa resolução do grande problema!"}, {"t": "p", "text": "O que faz tambem com que homens de valor no nosso tempo possam acceitar fabulas tão pueris, como a de João Vaz Côrte Real e a de Jean Cousin, é que raros estudam a fundo o problema que pretendem resolver a seu modo, e não o sabem pôr em equação. Uns estabelecem a lenda de Christovão Colombo considerado como um visionario por dizer que se encontraria a India navegando-se pelo occidente, outros a lenda de Christovão Colombo tratado como um louco por imaginar que para o lado do occidente havia terras. E por isso dizem uns que elle sabia perfeitamente que havia terras porque tinha conhecimento de viagens a que os navegadores não tinham ligado importancia alguma e que tinham passado despercebidas, outros que algum dos reis com quem elle tratara, D. João II por exemplo, não ignoravam que havia terras para o occidente a grandissima distancia da Europa, porque a essas terras já um portuguez aportara, mas estavam convencidos que essas terras não eram a India, e n’isso, accrescenta-se, eram elles que tinham razão e não Colombo."}, {"t": "p", "text": "É mal posto o problema: que se poderia chegar á Asia indo-se pelo occidente, raros seriam os homens de alguma instrucção que o podessem pôr em duvida. A idéa da esphericidade da terra já penetrara em todos os espiritos, e a sua consequencia natural era que pelo occidente se poderia chegar ao oriente. Que devia haver terras para o occidente era por conseguinte egualmente incontestavel. A questão toda estava exclusivamente na distancia."}, {"t": "p", "text": "D. João II não julgava Colombo um visionario por elle lhe dizer que pelo occidente se chegaria á India, julgou-o um visionario por elle suppôr que poderia atravessar para chegar ao seu destino a enorme extensão dos mares. Não o suppoz visionario por elle cuidar que encontraria terras ao occidente, ainda que essas terras não fossem a India, suppôl-o visionario por elle imaginar que teria tempo de chegar a essas terras a salvamento. Logo, se Jean Cousin ou João Vaz Côrte Real tivessem realisado essa façanha, estavam dissipadas todas as duvidas."}, {"t": "p", "text": "Havia terras a grande distancia da Europa, terras que ou seriam a India, ou algum d’esses archipelagos em que Toscanelli tinha fé, que serviriam de escala aos navios que demandassem pelo occidente a Asia?O jubilo immenso que se sentiu na Hespanha quando Christovão Colombo voltou, sentir-se-hia em Lisboa quando João Vaz Côrte Real tornasse, ou sentir-se-hia em França quando Jean Cousin entrasse n’algum dos seus portos."}, {"t": "p", "text": "O erro d’aquelles que assim procuram contrapôr a glorias consagradas não só pela tradição, mas pelos factos incontestados e pelos resultados conseguidos, estas lendas pueris forjadas ou pela inveja dos contemporaneos, ou pela phantasia audaciosa dos historiadores sem probidade scientifica que abundaram no seculo XVII, está em pôrem completamente de parte o estudo do meio em que os grandes descobrimentos se fizeram, de modo que o infante D. Henrique e Colombo apparecem como uns vultos inexplicaveis sem raizes no passado e sem relações de especie alguma com o espirito das gerações de que fizeram parte. Querem então reduzir á estatura normal esses vultos descommunaes, e aproveitam qualquer tradição apocrypha para mostrarem com um sorriso de mofa, que elles não fizeram senão aproveitar os esforços inconscientes feitos por alguns vultos humildes, para forjarem com esse metal roubado a pobres as estatuas da sua grandeza."}, {"t": "p", "text": "Applique-se o methodo scientifico ao estudo d’estes grandes phenomenos da vida da humanidade, e ver-se-ha como o genio d’estes dois homens apparece ainda mais brilhante quando vemos que elle resume as vagas aspirações da geração a que pertencem, satisfaz a anciedade que ella sente, encontrando a solução que os outros debalde procuram. O infante D. Henrique surge no meio de uma geração que se debate na ancia do desconhecido, que se julga apertada na jaula d’este mundo antigo, e anceia por encontrar espaço mais amplo em que mais livremente respire. Havia um seculo já que a sede das viagens se apoderara dos espiritos, que o conhecimento da terra era a preoccupação constante de todos os espiritos mais illustrados e cultos, em que já se multiplicavam os documentos cartographicos, em que aquellas encyclopedias medievaes que tinham o titulo quasi consagrado de Imago mundi se enchiam com as mais phantasticas noções, revelando comtudo o ardor com que se procurava supprir com uma geographia conjectural a falta do conhecimento verdadeiro da terra. Já se tinham emprehendido as grandes viagens terrestres pela Asia, procuravam os povos maritimos sondar os segredos do Occeano. Tentavam os Normandos perscrutal-os, e a expedição de João de Bethencourt bem o demonstrou, aspiravam a descobril-os os Genovezes, e a infeliz expedição de Vivaldi de que nunca mais houve noticias depois das suas galés terem transposto o estreito de Gibraltar confirma-o cabalmente, queriam os Catalães encontral-os e Jayme Ferrer, que apenas transpoz o cabo Não, e não conseguiu passar além do Bojador, foi um dos que se illustraram n’essas tentativas; mas paralysou-os a tradição geographica tão enraizada nos seus espiritos como o estão hoje no nosso as theorias da geographia moderna. Logo que a costa africana, em vez de voltar para o oriente, continuava a seguir para o sul, internando-se por conseguinte na zona torrida, a affirmação scientifica de que o sol a ia tornar impossivel de se transpôr impunha-se ao espirito dos navegantes, e bastaria para os fazer recuar, ainda que as affirmações cathegoricas da orthodoxia e os terrores da superstição os não movessem. D. Henrique teve o genio de um livre espirito que se revolta contra uma tradição que se não baseia em dados positivos, e que a submette audaciosamente ao exame da experiencia, teve a coragem que transmittiu aos seus navegadores de arcar contra as affirmações da sciencia, contra os dogmas da religião, contra os pavores da lenda. Continuou e venceu! E a noticia do triumpho correu a Europa toda, e resoou em toda a parte como uma grande conquista do espirito humano, e a theoria das zonas inhabitaveis desappareceu, e a da impossibilidade de communicação entre as duas zonas temperadas dissipou-se, e a Egreja teve de se conformar com a existencia dos antipodas que ella considerava como uma affirmação incompativel com o espirito christão. Pois não se vê que tudo isso aconteceria, logo que um navegador audacioso tivesse penetrado na zona torrida, muito para além das regiões habitaveis? E não se vê tambem que semelhante navegação não passaria despercebida n’uma epocha em que era universal a anciedade pela ampliação dos conhecimentos geographicos?"}, {"t": "p", "text": "Succede o mesmo com Christovão Colombo. A existencia de terras para o occidente é um dos sonhos da humanidade desde longas eras. Quanto esse problema preoccuparia os navegadores portuguezes n’esse seculo XV todo illuminado pelas suas glorias pode bem imaginar-se. Attestam-n’o as aventurosas expedições dos mareantes açorianos; mas, como Vivaldi que procurou sondar as regiões inexploradas da Africa, muitos d’esses audaciosos se perderam no vasto Occeano, como Jayme Ferrer, outros chegaram a terras um pouco afastadas e foi assim que a ilha das Flores se descobriu, mas como o mesmo Ferrer recuando deante do Bojador, como Bethencourt não ousando afastar-se para além das costas de Marrocos, os açorianos desmaiaram deante da infinita solidão do Atlantico. Quando Colombo quebrou essas ultimas barreiras, com que enthusiasmo o receberam, com que despeito por lhe não ter dado inteiro credito o acolheu D. João II! Como logo partiram de toda a parte navios a sondar esses mares desconhecidos! Não aconteceria o mesmo se Jean Cousin ou João Vaz Côrte Real tivessem, antes de Colombo, vencido o grande obstaculo? Não seria para Lisboa ou para Dieppe que se voltaria logo a attenção e a inveja de toda a Europa?"}, {"t": "p", "text": "Assim, resumindo as questões capitaes em que se condensa o nosso ponto de vista, temos que os dois grandes problemas geographicos que foram resolvidos pelos navegadores do infante D. Henrique e pelas caravellas de Christovão Colombo eram as seguintes:"}, {"t": "p", "text": "1.º Atravessar a zona torrida, que, segundo as affirmações da sciencia, tornava impossivel a communicação entre as duas zonas temperadas, entre a terra em que habitamos e a terra antichthona, entre o mundo antigo que tinha Jerusalem no centro e o alter orbis onde a humanidade vivera antes do diluvio, transpôr o Atlantico, pintado pela lenda e pela tradição antiga como o mar tenebroso, entrar n’um occeano que passava por sobrenatural, onde se estava talvez á mercê das potencias infernaes;"}, {"t": "p", "text": "2.º Atravessar a solidão do Atlantico do occidente ao oriente, até chegar ás praias orientaes da Asia."}, {"t": "p", "text": "A resolução do segundo problema estava dependente da resolução do primeiro. O primeiro acto de audacia era abrir os mares fechados, mostrar que não tinha o Atlantico os perigos reaes e sobrenaturaes de que o rodeiavam a tradição scientifica e a lenda popular. Esse resolveram-n’o os Portuguezes, e ninguem os precedeu nem os podia preceder, pelo simples motivo de que, se alguem antes d’elles tivesse aberto o mare clausum, não teriam elles que o tornar a abrir. Não se fecha o mar como se fecha uma porta. Não tornam a crear-se os phantasmas que o primeiro audacioso dissipou. Se alguem, antes do infante, houvesse rasgado a cortina do mysterio que sequestrava o Atlantico, estava o Atlantico patente. A geographia systematica da antiguidade e da edade média caía em ruinas logo que o primeiro facto real e tangivel tivesse mostrado a inanidade do systema."}, {"t": "p", "text": "Resolvido o primeiro problema, trepidou-se deante do segundo. Não se oppunham á sua resolução nem as theorias geographicas dos antigos, porque bem conhecidas são, acima de tudo, as opiniões de Eratosthenes, nem as opiniões orthodoxas que não contrariavam de um modo formalmente directo as doutrinas de Colombo, nem as lendas maravilhosas que, depois da desapparição do mar Tenebroso, não faziam senão excitar os navegadores a procurarem no Occidente as ilhas paradisiacas de que S. Brandão voltára com as vestes rescendentes a celestiaes perfumes. O que se oppunha simplesmente á resolução do problema era a immensidade do Occeano, que parecia confirmada exactamente pelas navegações portuguezas. Navegara-se durante annos e ainda se não chegara ao sul da Africa. Quanto tempo teria de se navegar para se chegar á India! Embora! exclamava Toscanelli, um dos enthusiastas da escola colombina, porque, se lá não chegardes em breve, encontrareis disseminadas pelo Occeano centos e centos de ilhas e de archipelagos que servem de guarda avançada ao grande continente oriental. Sonho de visionario! dizia-se e Colombo era repellido. Mas Colombo persistiu e foi elle que rompeu o encanto, elle e só elle que por ninguem poderia ter sido precedido, porque, se o fosse, tinham caido por terra todas as objecções, visto que o problema estava reduzido a este simplissimo termo: atravessar o Occeano e encontrar terra a distancia a que cheguem os viveres de uma caravela. O primeiro que o conseguisse tinha quebrado o feitiço, tinha desvendado o mysterio. Portuguez, francez, hespanhol ou italiano, seria a sua volta saudada pelas acclamações freneticas de toda a Europa maritima. Se foi essa gloria que aureolou Colombo foi por que só a elle podia competir."}, {"t": "p", "text": "Curvemo-nos com respeito deante dos precursores, deante dos marinheiros que tentaram romper o mysterio, deante da intrepidez dos normandos que, depois de occupadas as Canarias, tentaram reconhecer a costa africana, e cujos cadaveres despedaçados nas rochas da costa marroquina foram o primeiro cimento com que se começou a erguer o monumento da gloria portugueza, deante da audacia dos catalães que mais adeante foram ainda, que já transpozeram o cabo Não, e que investiram talvez com o Bojador, mas não sacrifiquemos a essa homenagem a justa gloria que cabe aos que mais felizes, mais perseverantes, e sobretudo dirigidos por um genio excepcional, quebraram definitivamente as barreiras, e, sem hesitar um momento, proseguiram no caminho encetado, e methodicamente foram desenrolando folha a folha o livro do mundo desconhecido, ainda enrolado nas vagas, como se enrolavam em volumes os antigos papyros. Não acceitamos como uma especie de premio de consolação para os precursores menos felizes a phrase de Humboldt, que diz como que encolhendo os hombros deante da injustiça do mundo que as descobertas só se principiam a contar desde que formam serie. As descobertas contam-se desde que se fazem, e, se os Catalães ou os Normandos ou os Genovezes as tivessem feito, para elles iria a gloria. Não esperou a Europa que as caravelas do infante D. Henrique fossem muito adeante para que affluissem a Portugal estrangeiros, nem o governo portuguez esperou por isso para reclamar do Papa o reconhecimento do seu direito. Descobrem-se as Canarias? Logo apparecem Portuguezes, Francezes e Hespanhoes a reclamar a sua posse. Descobriam-se os Açores e a Madeira e ninguem com isso se importava. Não, o Homero da grande epopéa maritima foi o infante D. Henrique. Antes dos grandes epicos apparecem os cantos vagos e anonymos, em que se desata a inspiração da musa popular, em que se modulam as aspirações e os enthusiasmos do povo. Chega emfim o grande cantor, o epico inspirado, em cuja fronte Deus accendeu a scentelha do genio, e que escuta pensativo esses echos da guerra, essas cantilenas sublimes. Incende-se-lhe a imaginação, concentra na sua alma as palpitações da alma nacional, e dos seus labios brota emfim a epopéa victoriosa em que tudo se condensa, e encontra a sua expressão definitiva, que se fixa para sempre na memoria do povo e na memoria da humanidade. As caravelas que iam ainda, silenciosas e timidas, aventurar-se ao mar mysterioso, e que ou voltavam sem ter rompido o mysterio, ou no mysterio das vagas envolviam os seus cadaveres fluctuantes, eram os bardos isolados que afinavam pelo rugido do Occeano os seus epodos audaciosos, mas o infante foi o poeta soberano que fez irromper da sua alma, pela voz dos seus marinheiros, a epopéa triumphal e definitiva, a Iliada da audacia portugueza, como foi Colombo depois que desenrolou no sulco argenteo dos seus navios a Odysséa do Atlantico."}]}]};

const WRE = /[A-Za-zÀ-ÖØ-öø-ÿ']+/g;
const SRE = /(?<=[.!?;:])\s+/;
const main = document.getElementById('main');
function render(){
  for (const ch of DATA.chapters){
    const h = document.createElement('h2'); h.textContent = ch.title; main.appendChild(h);
    for (const p of ch.paras){
      const el = document.createElement(p.t === 'h' ? 'h3' : 'p');
      if (p.t === 'h'){ el.textContent = p.text; }
      else {
        for (const sent of p.text.split(SRE)){
          if (!sent.trim()) continue;
          const s = document.createElement('span'); s.className = 's';
          let last = 0, m;
          WRE.lastIndex = 0;
          while ((m = WRE.exec(sent)) !== null){
            s.appendChild(document.createTextNode(sent.slice(last, m.index)));
            const w = document.createElement('span');
            const lo = m[0].toLowerCase(), g = GLOSS[lo];
            if (g){ w.className = 'w'; w.dataset.o = m[0]; w.dataset.g = g; w.textContent = m[0]; }
            else { w.className = 'w x'; w.textContent = m[0]; }
            s.appendChild(w); last = m.index + m[0].length;
          }
          s.appendChild(document.createTextNode(sent.slice(last)));
          el.appendChild(s); el.appendChild(document.createTextNode(' '));
        }
      }
      main.appendChild(el);
    }
  }
}
main.addEventListener('click', e => {
  const w = e.target.closest('.w');
  if (!w || w.classList.contains('x')) return;
  const toG = !w.classList.contains('f');
  w.textContent = toG ? w.dataset.g : w.dataset.o;
  w.title = toG ? w.dataset.o : w.dataset.g;
  w.classList.toggle('f', toG);
});
main.addEventListener('dblclick', e => {
  const s = e.target.closest('.s');
  if (!s) return;
  const ws = s.querySelectorAll('.w:not(.x)');
  const anyOff = [...ws].some(w => !w.classList.contains('f'));
  ws.forEach(w => {
    w.textContent = anyOff ? w.dataset.g : w.dataset.o;
    w.title = anyOff ? w.dataset.o : w.dataset.g;
    w.classList.toggle('f', anyOff);
  });
});
document.getElementById('unflip').onclick = () =>
  document.querySelectorAll('.w.f').forEach(w => {
    w.textContent = w.dataset.o; w.title = w.dataset.g; w.classList.remove('f');
  });
const fsBtn = d => {
  let fs = parseFloat(localStorage.frFs || '1.15') + d * 0.12;
  fs = Math.min(1.9, Math.max(0.85, fs));
  document.body.style.fontSize = fs + 'rem'; localStorage.frFs = fs;
};
document.getElementById('fs-').onclick = () => fsBtn(-1);
document.getElementById('fs+').onclick = () => fsBtn(1);
const html = document.documentElement;
if (localStorage.frDk === '1') html.setAttribute('data-dk', '');
document.getElementById('dk').onclick = () => {
  const on = html.hasAttribute('data-dk');
  if (on) html.removeAttribute('data-dk'); else html.setAttribute('data-dk', '');
  localStorage.frDk = on ? '0' : '1';
};
let fsInit = localStorage.frFs;
if (fsInit) document.body.style.fontSize = fsInit + 'rem';
addEventListener('beforeunload', () => {
  localStorage.frPos = scrollY / Math.max(1, document.body.scrollHeight - innerHeight);
});
render();
if (localStorage.frPos) scrollTo(0, localStorage.frPos * (document.body.scrollHeight - innerHeight));
