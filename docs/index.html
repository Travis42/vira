<script>
const DATA = {"chapters": [{"title": "A Cidade e as Serras/I", "url": "https://pt.wikisource.org/wiki/A_Cidade_e_as_Serras/I", "paras": [{"t": "p", "text": "O meu amigo Jacintho nasceu n’um palacio, com cento e nove contos de renda em terras de semeadura, de vinhedo, de cortiça e d’olival."}, {"t": "p", "text": "No Alemtejo, pela Extremadura, atravez das duas Beiras, densas sebes ondulando por collina e valle, muros altos de boa pedra, ribeiras, estradas, delimitavam os campos d’esta velha familia agricola que já entulhava grão e plantava cepa em tempos d’el-rei D. Diniz. A sua quinta e casa senhorial de Tormes, no Baixo Douro, cobriam uma serra. Entre o Tua e o Tinhela, por cinco fartas legoas, todo o torrão lhe pagava fôro. E cerrados pinheiraes seus negrejavam desde Arga até ao mar d’Ancora. Mas o palacio onde Jacintho nascêra, e onde sempre habitára, era em Paris, nos Campos Elyseos, n.º 202."}, {"t": "p", "text": "Seu avô, aquelle gordissimo e riquissimo Jacintho a quem chamavam em Lisboa o D. Galião, descendo uma tarde pela travessa da Trabuqueta, rente d’um muro de quintal que uma parreira toldava, escorregou n’uma casca de laranja e desabou no lagedo. Da portinha da horta sahia n’esse momento um homem moreno, escanhoado, de grosso casaco de baetão verde e botas altas de picador, que, galhofando e com uma força facil, levantou o enorme Jacintho — até lhe apanhou a bengala de castão d’ouro que rolára para o lixo. Depois, demorando n’elle os olhos pestanudos e pretos:"}, {"t": "p", "text": "— Oh Jacintho Galião, que andas tu aqui, a estas horas, a rebolar pelas pedras?"}, {"t": "p", "text": "E Jacintho, aturdido e deslumbrado, reconheceu o snr. Infante D. Miguel!"}, {"t": "p", "text": "Desde essa tarde amou aquelle bom Infante como nunca amára, apesar de tão guloso, o seu ventre, e apesar de tão devoto o seu Deus! Na sala nobre da sua casa (á Pampulha) pendurou sobre os damascos o retrato do «seu Salvador», enfeitado de palmitos como um retabulo, e por baixo a bengala que as magnanimas mãos reaes tinham erguido do lixo. Emquanto o adoravel, desejado Infante penou no desterro de Vienna, o barrigudo senhor corria, sacudido na sua sege amarella, do botequim do Zé-Maria em Belem á botica do Placido nos Algibebes, a gemer as saudades do anginho, a tramar o regresso do anginho. No dia, entre todos bemdito, em que a Perola appareceu á barra com o Messias, engrinaldou a Pampulha, ergueu no Caneiro um monumento de papelão e lona onde D. Miguel, tornado S. Miguel, branco, d’aureola e azas de Archanjo, furava de cima do seu corcel d’Alter o Dragão do Liberalismo, que se estorcia vomitando a Carta. Durante a guerra com o «outro, com o pedreiro livre» mandava recoveiros a Santo Thyrso, a S. Gens, levar ao Rei fiambres, caixas de dôce, garrafas do seu vinho de Tarrafal, e bolsas de retroz atochadas de peças que elle ensaboava para lhes avivar o ouro. E quando soube que o snr. D. Miguel, com dois velhos bahus amarrados sobre um macho, tomára o caminho de Sines e do final desterro — Jacintho Galião correu pela casa, fechou todas as janellas como n’um luto, berrando furiosamente:"}, {"t": "p", "text": "— Tambem cá não fico! tambem cá não fico!"}, {"t": "p", "text": "Não, não queria ficar na terra perversa d’onde partia, esbulhado e escorraçado, aquelle Rei de Portugal que levantava na rua os Jacinthos! Embarcou para França com a mulher, a snr.a D. Angelina Fafes (da tão fallada casa dos Fafes da Avellan); com o filho, o ’Cinthinho, menino amarellinho, mollesinho, coberto de caróços e leicenços; com a aia e com o moleque. Nas costas da Cantabria o paquete encontrou tão rijos mares que a snr.a D. Angelina, esguedelhada, de joelhos na enxerga do beliche, prometteu ao Senhor dos Passos d’Alcantara uma corôa d’espinhos, de ouro, com as gottas de sangue em rubis do Pegu. Em Bayonna, onde arribaram, ’Cinthinho teve ithericia. Na estrada d’Orleans, n’uma noite agreste, o eixo da berlinda em que jornadeavam partiu, e o nedio senhor, a delicada senhora da casa da Avellan, o menino, marcharam tres horas na chuva e na lama do exilio até uma aldeia, onde, depois de baterem como mendigos a portas mudas, dormiram nos bancos d’uma taberna. No «Hotel dos Santos Padres», em Paris, soffreram os terrores d’um fogo que rebentára na cavalhariça, sob o quarto de D. Galião, e o digno fidalgo, rebolando pelas escadas em camisa, até ao pateo, enterrou o pé nú numa lasca de vidro. Então ergueu amargamente ao céo o punho cabelludo, e rugiu:"}, {"t": "p", "text": "— Irra! É de mais!"}, {"t": "p", "text": "Logo n’essa semana, sem escolher, Jacintho Galião comprou a um Principe polaco, que depois da tomada de Varsovia se mettera frade cartuxo, aquelle palacete dos Campos Elyseos, n.º 202. E sob o pesado ouro dos seus estuques, entre as suas ramalhudas sedas se enconchou, descançando de tantas agitações, n’uma vida de pachorra e de boa mesa, com alguns companheiros d’emigração (o desembargador Nuno Velho, o conde de Rabacena, outros menores), até que morreu de indigestão, d’uma lampreia d’escabeche que lhe mandára o seu procurador em Monte-mór. Os amigos pensavam que a snr.a D. Angelina Fafes voltaria ao reino. Mas a boa senhora temia a jornada, os mares, as caleças que racham. E não se queria separar do seu Confessor, nem do seu Medico, que tão bem lhe comprehendiam os escrupulos e a asthma."}, {"t": "p", "text": "— Eu, por mim, aqui fico no 202 (declarára ella), ainda que me faz falta a boa agua d’Alcolena... O ’Cinthinho, esse, em crescendo, que decida."}, {"t": "p", "text": "O ’Cinthinho crescèra. Era um moço mais esguio e livido que um cirio, de longos cabellos corredios, narigudo, silencioso, encafuado em roupas pretas, muito largas e bambas; de noite, sem dormir, por causa da tosse e de suffocações, errava em camisa com uma lamparina atravez do 202; e os creados na copa sempre lhe chamavam a Sombra. N’essa sua mudez e indecisão de sombra surdira, ao fim do luto do papá, o gosto muito vivo de tornear madeiras ao torno: depois, mais tarde, com a melada flôr dos seus vinte annos, brotou n’elle outro sentimento, de desejo e de pasmo, pela filha do desembargador Velho, uma menina redondinha como uma rôla, educada n’um convento de Paris, e tão habilidosa que esmaltava, dourava, concertava relogios e fabricava chapéos de feltro. No outomno de 1851, quando já se desfolhavam os castanheiros dos Campos Elyseos, o ’Cinthinho cuspilhou sangue. O medico, acarinhando o queixo e com uma ruga seria na testa immensa, aconselhou que o menino abalasse para o golfo Juan ou para as tepidas areias d’Arcachon."}, {"t": "p", "text": "’Cinthinho porém, no seu afèrro de sombra, não se quiz arredar da Therezinha Velho, de quem se tornára, atravez de Paris, a muda, tardônha sombra. Como uma sombra, casou; deu mais algumas voltas ao torno; cuspiu um resto de sangue; e passou, como uma sombra."}, {"t": "p", "text": "Tres mezes e tres dias depois do seu enterro o meu Jacintho nasceu."}, {"t": "p", "text": "Desde o berço, onde a avó espalhava funcho e ambar para afugentar a Sorte-Ruim, Jacintho medrou com a segurança, a rijeza, a seiva rica d’um pinheiro das dunas.."}, {"t": "p", "text": "Não teve sarampo e não teve lombrigas. As Letras, a Taboada, o Latim entraram por elle tão facilmente como o sol por uma vidraça. Entre os camaradas, nos pateos dos collegios, erguendo a sua espada de lata e lançando um brado de commando, foi logo o vencedor, o Rei que se adula, e a quem se cede a fructa das merendas. Na edade em que se lê Balzac e Musset nunca atravessou os tormentos da sensibilidade; — nem crepusculos quentes o retiveram na solidão d’uma janella, padecendo d’um desejo sem fórma e sem nome. Todos os seus amigos (eramos tres, contando o seu velho escudeiro preto, o Grillo) lhe conservaram sempre amizades puras e certas — sem que jámais a participação do seu luxo as avivasse ou fossem desanimadas pelas evidencias do seu egoismo. Sem coração bastante forte para conceber um amor forte, e contente com esta incapacidade que o libertava, do amor só experimentou o mel — esse mel que o amor reserva aos que o recolhem, á maneira das abelhas, com ligeireza, mobilidade e cantando. Rijo, rico, indifferente ao Estado e ao Governo dos Homens, nunca lhe conhecemos outra ambição além de comprehender bem as Ideias Geraes; e a sua intelligencia, nos annos alegres de escólas e controversias, círculava dentro das Philosophias mais densas como enguia lustrosa na agua limpa d’um tanque. O seu valor, genuino, de fino quilate, nunca foi desconhecido, nem desapreciado; e toda a opinião, ou mera facecia que lançasse, logo encontrava uma aragem de sympathia e concordancia que a erguia, a mantinha emballada e rebrilhando nas alturas. Era servido pelas cousas com docilidade e carinho; — e não recordo que jamais lhe estalasse um botão da camisa, ou que um papel maliciosamente se escondesse dos seus olhos, ou que ante a sua vivacidade e pressa uma gaveta perfida emperrasse. Quando um dia, rindo com descrido riso da Fortuna e da sua Roda, comprou a um sachristão hespanhol um Decimo de Loteria, logo a Fortuna, ligeira e ridente sobre a sua Roda, correu n’um fulgor, para lhe trazer quatro centas mil pesetas. E no ceu as Nuvens, pejadas e lentas, se avistavam Jacintho sem guarda chuva, retinham com reverencia as suas aguas até que elle passasse... Ah! o ambar e o funcho da snr.a D. Angelina tinham escorraçado do seu destino, bem triumphalmente e para sempre, a Sorte-Ruim! A amoravel avó (que eu conheci obesa, com barba) costumava citar um soneto natalicio do desembargador Nunes Velho contendo um verso de boa lição:"}, {"t": "p", "text": "Sabei, senhora, que esta Vida é um rio..."}, {"t": "p", "text": "Pois um rio de verão, manso, translucido, harmoniosamente estendido sobre uma areia macia e alva, por entre arvoredos fragrantes e ditosas aldeias, não offereceria áquelle que o descesse n’um barco de cedro, bem toldado e bem almofadado, com fructas e Champagne a refrescar em gelo, um Anjo governando ao leme, outros Anjos puxando á sirga, mais segurança e doçura do que a Vida offerecia ao meu amigo Jacintho."}, {"t": "p", "text": "Por isso nós lhe chamavamos «o Principe da Gran-Ventura»!"}, {"t": "p", "text": "Jacintho e eu, José Fernandes, ambos nos encontramos e acamaradamos em Paris, nas Escólas do Bairro Latino — para onde me mandára meu bom tio Affonso Fernandes Lorena de Noronha e Sande, quando aquelles malvados me riscaram da Universidade por eu ter esborrachado, n’uma tarde de procissão, na Sophia, a cara sordida do dr. Paes Pitta."}, {"t": "p", "text": "Ora n’esse tempo Jacintho concebêra uma Ideia... Este Principe concebêra a Ideia de que «o homem só é superiormente feliz quando é superiormente civilisado». E por homem civilisado o meu camarada entendia aquelle que, robustecendo a sua força pensante com todas as noções adquiridas desde Aristoteles, e multiplicando a potencia corporal dos seus orgãos com todos os mechanismos inventados desde Theramenes, creador da roda, se torna um magnifico Adão, quasí omnipotente, quasí omnisciente, e apto portanto a recolher dentro d’uma sociedade e nos limites do Progresso (tal como elle se comportava em 1875) todos os gozos e todos os proveitos que resultam de Saber e de Poder... Pelo menos assim Jacintho formulava copiosamente a sua Ideia, quando conversavamos de fins e destinos humanos, sorvendo bocks poeirentos, sob o toldo das cervejarias philosophicas, no Boulevard Saint-Michel."}, {"t": "p", "text": "Este conceito de Jacintho impressionára os nossos camaradas de cenaculo, que tendo surgido para a vida intellectual, de 1866 a 1875, entre a batalha de Sadowa e a batalha de Sedan, e ouvindo constantemente, desde então, aos technicos e aos philosophos, que fôra a Espingarda-de-agulha que vencêra em Sadowa e fôra o Mestre-de-escóla quem vencêra em Sedan, estavam largamente preparados a acreditar que a felicidade dos individuos, como a das nações, se realisa pelo illimitado desenvolvimento da Mechanica e da Erudição. Um d’esses moços mesmo, o nosso inventivo Jorge Carlande, reduzíra a theoria de Jacintho, para lhe facilitar a circulação e lhe condensar o brilho, a uma fórma algebrica:"}, {"t": "p", "text": "Summa sciencia"}, {"t": "p", "text": "Summa potencia = Summa felicidade"}, {"t": "p", "text": "E durante dias, do Odeon á Sorbonna, foi louvada pela mocidade positiva a Equação Metaphysica de Jacintho."}, {"t": "p", "text": "Para Jacintho, porém, o seu conceito não era meramente metaphysico e lançado pelo gozo elegante de exercer a razão especulativa: — mas constituia uma regra, toda de realidade e de utilidade, determinando a conducta, modalisando a vida. E já a esse tempo, em concordancia com o seu preceito — elle se surtira da Pequena Encyclopedia dos Conhecimentos Universaes em setenta e cinco volumes e installára, sobre os telhados do 202, n’um mirante envidraçado, um telescopio. Justamente com esse telescopio me tornou elle palpavel a sua ideia, n’uma noite de agosto, de molle e dormente calor. Nos céos remotos lampejavam relampagos languidos. Pela Avenida dos Campos Elyseos, os fiacres rolavam para as frescuras do Bosque, lentos, abertos, cançados, transbordando de vestidos claros.."}, {"t": "p", "text": "— Aqui tens tu, Zé Fernandes, (começou Jacintho, encostado á janella do mirante) a theoria que me governa, bem comprovada. Com estes olhos que recebemos da Madre natureza, lestos e sãos, nós podemos apenas distinguir além, atravez da Avenida, n’aquella loja, uma vidraça alumiada. Mais nada! Se eu porém aos meus olhos juntar os dois vidros simples d’um binoculo de corridas, percebo, por traz da vidraça, presuntos, queijos, boiões de gelêa e caixas de ameixa sêcca. Concluo portanto que é uma mercearia. Obtive uma noção; tenho sobre ti, que com os olhos desarmados vês só o luzir da vidraça, uma vantagem positiva. Se agora, em vez d’estes vidros simples, eu usasse os do meu telescopio, de composição mais scientifica, poderia avistar além, no planeta Marte, os mares, as neves, os canaes, o recorte dos golphos, toda a geographia d’um astro que circula a milhares de leguas dos Campos Elyseos. É outra noção, e tremenda! Tens aqui pois o olho primitivo, o da Natureza, elevado pela Civilisação á sua maxima potencia de visão. E desde já, pelo lado do olho portanto, eu, civilisado, sou mais feliz que o incivilisado, porque descubro realidades do Universo que elle não suspeita e de que está privado. Applica esta prova a todos os orgãos e comprehendes o meu principio. Emquanto á intelligencia, e á felicidade que d’ella se tira pela incançavel accumulação das noções, só te peco que compares Renan e o Grillo... Claro é portanto que nos devemos cercar de Civilisação nas maximas proporções para gosar nas maximas proporções a vantagem de viver. Agora concordas, Zé Fernandes?"}, {"t": "p", "text": "Não me parecia irrecusavelmente certo que Renan fosse mais feliz que o Grillo; nem eu percebia que vantagem espiritual ou temporal se côlha em distinguir atravez do espaço manchas n’um astro, ou atravez da Avenida dos Campos Elyseos presuntos n’uma vidraça. Mas concordei, porque sou bom, e nunca desalojarei um espirito do conceito onde elle encontra segurança, disciplina e motivo de energia. Desabotoei o collete, e lançando um gesto para o lado dos cafés e das luzes:"}, {"t": "p", "text": "— Vamos então beber, nas maximas proporções, brandy and soda, com gelo!"}, {"t": "p", "text": "Por uma conclusão bem natural, a ideia de Civilisação, para Jacintho, não se separava da imagem de Cidade, d’uma enorme Cidade, com todos os seus vastos orgãos funccionando poderosamente. Nem este meu super-civilisado amigo comprehendia que longe de Armazens servidos por tres mil caixeiros; e de Mercados onde se despejam os vergeis e lezirias de trinta provincias; e de Bancos em que retine o ouro universal; e de Fabricas fumegando com ancia, inventando com ancia; e de Bibliothecas abarrotadas, a estalar, com a papelada dos seculos; e de fundas milhas de ruas, cortadas, por baixo e por cima, de fios de telegraphos, de fios de telephones, de canos de gazes, de canos de fezes; e da fila atroante dos omnibus, tramways, carroças, velocipedes, calhambeques, parelhas de luxo; e de dois milhões d’uma vaga humanidade, fervilhando, a offegar, atravez da Policia, na busca dura do pão ou sob a illusão do gozo — o homem do seculo XIX podesse saborear, plenamente, a delicia de viver!"}, {"t": "p", "text": "Quando Jacintho, no seu quarto do 202, com as varandas abertas sobre os lilazes, me desenrolava estas imagens, todo elle crescia, illuminado. Que creação augusta, a da Cidade! Só por ella, Zé-Fernandes, só por ella, póde o homem soberbamente affirmar a sua alma!..."}, {"t": "p", "text": "— Oh Jacintho, e a religião? Pois a religião não prova a alma?"}, {"t": "p", "text": "Elle encolhia os hombros. A religião! A religião é o desenvolvimento sumptuoso de um instincto rudimentar, commum a todos os brutos, o terror. Um cão lambendo a mão do dono, de quem lhe vem o osso ou o chicote, já constitue toscamente um devoto, o consciente devoto, prostrado em rezas ante o Deus que distribue o céo ou o inferno!... Mas o telephone! o phonographo!"}, {"t": "p", "text": "— Ahi tens tu, o phonographo!... Só o phonographo, Zé Fernandes, me faz verdadeiramente sentir a minha superioridade de sêr pensante e me separa do bicho. Acredita, não ha senão a Cidade, Zé Fernandes, não ha senão a Cidade!"}, {"t": "p", "text": "E depois (accrescentava) só a Cidade lhe dava a sensação, tão necessaria á vida como o calor, da solidariedade humana. E no 202, quando considerava em redor, nas densas massas do casario de Paris, dois milhões de sêres arquejando na obra da Civilisação (para manter na natureza o dominio dos Jacinthos!) sentia um socego, um conchego, só comparaveis ao do peregrino, que, ao atravessar o deserto, se ergue no seu dromedario, e avista a longa fila da caravana marchando, cheia de lumes e de armas..."}, {"t": "p", "text": "Eu murmurava, impressionado:"}, {"t": "p", "text": "— Caramba!"}, {"t": "p", "text": "Ao contrario no campo, entre a inconsciencia e a impassibilidade da Natureza, elle tremia com o terror da sua fragilidade e da sua solidão. Estava ahi como perdido n’um mundo que lhe não fosse fraternal; nenhum silvado encolheria os espinhos para que elle passasse; se gemesse com fome nenhuma arvore, por mais carregada, lhe estenderia o seu fructo na ponta compassiva d’um ramo. Depois, em meio da Natureza, elle assistia á subita e humilhante inutilisação de todas as suas faculdades superiores. De que servia, entre plantas e bichos — ser um Genio ou ser um Santo? As searas não comprehendem as Georgicas; e fôra necessario o socorro ancioso de Deus, e a inversão de todas as leis naturaes, e um violento milagre para que o lobo de Agubio não devorasse S. Francisco d’Assis, que lhe sorria e lhe estendia os braços e lhe chamava «meu irmão lobo»! Toda a intellectualidade, nos campos, se esterilisa, e só resta a bestialidade. N’esses reinos crassos do Vegetal e do Animal duas unicas funcções se mantêm vivas, a nutritiva e a procreadora. Isolada, sem occupação, entre focinhos e raizes que não cessam de sugar e de pastar, suffocando no calido bafo da universal fecundação, a sua pobre alma toda se engelhava, se reduzia a uma migalha d’alma, uma fagulhasinha espiritual a tremeluzir, como morta, sobre um naco de materia; e n’essa materia dois instinctos surdiam, imperiosos e pungentes, o de devorar e o de gerar. Ao cabo de uma semana rural, de todo o seu sêr tão nobremente composto só restava um estomago e por baixo um phallus! A alma? Sumida sob a besta. E necessitava correr, reentrar na Cidade, mergulhar nas ondas lustraes da Civilisação, para largar n’ellas a crosta vegetativa, e resurgir re-humanisado, de novo espiritual e Jacinthico!"}, {"t": "p", "text": "E estas requintadas metaphoras do meu amigo exprimiam sentimentos reaes — que eu testemunhei, que muito me divertiram, no unico passeio que fizemos ao campo, á bem amavel e bem sociavel floresta de Montmorency. Oh delicias d’entremez, Jacintho entre a Natureza! Logo que se afastava dos pavimentos de madeira, do macadam, qualquer chão que os seus pés calcassem o enchia de desconfiança e terror. Toda a relva, por mais crestada, lhe parecia reçumar uma humidade mortal. De sob cada torrão, da sombra de cada pedra, receava o assalto de lacraus, de viboras, de fórmas rastejantes e viscosas. No silencio do bosque sentia um lugubre despovoamento do Universo. Não tolerava a familiaridade dos galhos que lhe roçassem a manga ou a face. Saltar uma sebe era para elle um acto degradante que o retrogradava ao macaco inicial. Todas as flôres que não tivesse já encontrado em jardins, domesticadas por longos seculos de servidão ornamental, o inquietavam como venenosas. E considerava d’uma melancolia funambulesca certos modos e fórmas do Sêr inanimado, a pressa esperta e vã dos regatinhos, a careca dos rochedos, todas as contorsões do arvoredo e o seu resmungar solemne e tonto."}, {"t": "p", "text": "Depois d’uma hora, n’aquelle honesto bosque de Montmorency, o meu pobre amigo abafava, apavorado, experimentando já esse lento mingoar e sumir d’alma que o tornava como um bicho entre bichos. Só desannuviou quando penetramos no lagêdo e no gaz de Paris — e a nossa vittoria quasi se despedaçou contra um omnibus retumbante, atulhado de cidadãos. Mandou descer pelos Boulevards, para dissipar, na sua grossa sociabilidade, aquella materialisação em que sentia a cabeça pesada e vaga como a d’um boi. E reclamou que eu o acompanhasse ao theatro das Variedades para sacudir, com os estribilhos da Femme à Papa, o rumor importuno que lhe ficára dos melros cantando nos choupos altos."}, {"t": "p", "text": "Este delicioso Jacintho fizera então vinte e tres annos, e era um soberbo moço em quem reapparecêra a força dos velhos Jacinthos ruraes. Só pelo nariz, afilado, com narinas quasi transparentes, d’uma mobilidade inquieta, como se andasse fariscando perfumes, pertencia ás delicadezas do seculo XIX. O cabello ainda se conservava, ao modo das éras rudes, crespo e quasi lanigero: e o bigode, como o d’um Celta, cahia em fios sedosos, que elle necessitava aparar e frizar. Todo o seu fato, as espessas gravatas de setim escuro que uma perola prendia, as luvas de anta branca, o verniz das botas, vinham de Londres em caixotes de cedro; e usava sempre ao peito uma flôr, não natural, mas composta destramente pela sua ramalheteira com petalas de flôres dessemelhantes, cravo, azalea, orchidea ou tulipa, fundidas na mesma haste entre uma leve folhagem de funcho."}, {"t": "p", "text": "Em 1880, em Fevereiro, n’uma cinzenta e arripiada manhã de chuva, recebi uma carta de meu bom tio Affonso Fernandes, em que, depois de lamentações sobre os seus setenta annos, os seus males hemorroidaes, e a pesada gerencia dos seus bens «que pedia homem mais novo, com pernas mais rijas» — me ordenava que recolhesse á nossa casa de Guiães, no Douro! Encostado ao marmore partido do fogão, onde na véspera a minha Nini deixára um espartilho embrulhado no Jornal dos Debates, censurei severamente meu tio que assim cortava em botão, antes de desabrochar, a flôr do meu Saber Juridico. Depois n’um Post-Scriptum elle accrescentava — «O tempo aqui está lindo, o que se póde chamar de rosas, e tua santa tia muito se recommenda, que anda lá pela cozinha, porque vai hoje em trinta e seis annos que casámos, temos cá o abbade e o Quintaes a jantar, e ella quiz fazer uma sopa dourada»."}, {"t": "p", "text": "Deitando uma acha ao lume, pensei como devia estar boa a sopa dourada da tia Vicencia. Ha quantos annos não a provava, nem o leitão assado, nem o arroz de fôrno da nossa casa! Com o tempo assim tão lindo, já as mimosas do nosso pateo vergariam sob os seus grandes cachos amarellos. Um pedaço de céo azul, do azul de Guiães, que outro não ha tão lustroso e macio, entrou pelo quarto, alumiou, sobre a poida tristeza do tapete, relvas, ribeirinhos, malmequeres e flôres de trevo de que meus olhos andavam agoados. E, por entre as bambinellas de sarja, passou um ar fino e forte e cheiroso de serra e de pinheiral."}, {"t": "p", "text": "Assobiando um fado meigo tirei debaixo da cama a minha velha mala, e metti solicitamente entre calças e piugas um Tratado de Direito Civil, para aprender emfim, nos vagares da aldeia, estendido sob a faia, as leis que regem os homens. Depois, n’essa tarde, annunciei a Jacintho que partia para Guiães. O meu camarada recuou com um surdo gemido de espanto e piedade:"}, {"t": "p", "text": "— Para Guiães!... Oh Zé Fernandes, que horror!"}, {"t": "p", "text": "E toda essa semana me lembrou solicitamente confortos de que eu me deveria prover para que pudesse conservar, nos ermos silvestres, tão longe da Cidade, uma pouca d’alma dentro d’um pouco de corpo. «Leva uma poltrona! Leva a Encyclopedia Geral! Leva caixas de aspargos!...»"}, {"t": "p", "text": "Mas para o meu Jacintho, desde que assim me arrancavam da Cidade, eu era arbusto desarraigado que não reviverá. A magoa com que me acompanhou ao comboio conviria excellentemente ao meu funeral. E quando fechou sobre mim a portinhola, gravemente, supremamente, como se cerra uma grade de sepultura, eu quasi solucei — com saudades minhas."}, {"t": "p", "text": "Cheguei a Guiães. Ainda restavam flôres nas mimosas do nosso pateo; comi com delicias a sopa dourada da tia Vicencia; de tamancos nos pés assisti á ceifa dos milhos. E assim de colheitas a lavras, crestando ao sol das eiras, caçando a perdiz nos matos geados, rachando a melancia fresca na poeira dos arraiaes, arranchando a magustos, serandando á candeia, atiçando fogueiras de S. João, enfeitando presepios de Natal, por alli me passaram docemente sete annos, tão atarefados que nunca logrei abrir o Tratado de Direito Civil, e tão singelos que apenas me recordo quando, em vésperas de S. Nicolau, o abbade cahiu da egua á porta do Braz das Córtes. De Jacintho só recebia raramente algumas linhas, escrevinhadas á pressa por entre o tumulto da Civilisação. Depois, n’um Setembro muito quente, ao lidar da vindima, meu bom tio Affonso Fernandes morreu, tão quietamente, Deus seja louvado por esta graça, como se cala um passarinho ao fim do seu bem cantado e bem voado dia. Acabei pela aldeia a roupa do luto. A minha afilhada Joanninha casou na matança do porco. Andaram obras no nosso telhado. Voltei a Paris."}]}, {"title": "A Cidade e as Serras/II", "url": "https://pt.wikisource.org/wiki/A_Cidade_e_as_Serras/II", "paras": [{"t": "p", "text": "Era de novo Fevereiro, e um fim de tarde arripiado e cinzento, quando eu desci os Campos Elyseos em demanda do 202. Adiante de mim caminhava, levemente curvado, um homem que, desde as botas rebrilhantes até ás abas recurvas do chapéo d’onde fugiam anneis d’um cabello crespo, reçumava elegancia e a familiaridade das coisas finas. Nas mãos, cruzadas atraz das costas, calçadas d’anta branca, sustentava uma bengala grossa com castão de crystal. E só quando elle parou ao portão do 202 reconheci o nariz afilado, os fios do bigode corredios e sedosos."}, {"t": "p", "text": "— Oh Jacintho!"}, {"t": "p", "text": "— Oh Zé Fernandes!"}, {"t": "p", "text": "O abraço que nos enlaçou foi tão alvoroçado que o meu chapéo rolou na lama. E ambos murmuravamos, commovidos, entrando a grade:"}, {"t": "p", "text": "— Ha sete annos!..."}, {"t": "p", "text": "— Ha sete annos!..."}, {"t": "p", "text": "E, todavia, nada mudára durante esses sete annos no jardim do 202! Ainda entre as duas aleas bem areadas se arredondava uma relva, mais lisa e varrida que a lã d’um tapete. No meio o vaso corinthico esperava Abril para resplandecer com tulipas e depois Junho para transbordar de margaridas. E ao lado das escadas limiares, que uma vidraçaria toldava, as duas magras Deusas de pedra, do tempo de D. Galião, sustentavam as antigas lampadas de globos foscos, onde já silvava o gaz."}, {"t": "p", "text": "Mas dentro, no peristillo, logo me surprehendeu um elevador installado por Jacintho — apesar do 202 ter sómente dois andares, e ligados por uma escadaria tão doce que nunca offendêra a asthma da snr.a D. Angelina! Espaçoso, tapetado, elle offerecia, para aquella jornada de sete segundos, confortos numerosos, um divan, uma pelle d’urso, um roteiro das ruas de Paris, prateleiras gradeadas com charutos e livros. Na antecamara, onde desembarcamos, encontrei a temperatura macia e tepida d’uma tarde de Maio, em Guiães. Um creado, mais attento ao thermometro que um piloto á agulha, regulava destramente a bocca dourada do calorifero. E perfumadores entre palmeiras, como n’um terrasso santo de Benares, esparziam um vapor, aromatisando e salutarmente humedecendo aquelle ar delicado e superfino."}, {"t": "p", "text": "Eu murmurei, nas profundidades do meu assombrado sêr:"}, {"t": "p", "text": "— Eis a civilisação!"}, {"t": "p", "text": "Jacintho empurrou uma porta, penetramos n’uma nave cheia de magestade e sombra, onde reconheci a Bibliotheca por tropeçar n’uma pilha monstruosa de livros novos. O meu amigo roçou de leve o dedo na parede: e uma corôa de lumes electricos, refulgindo entre os lavores do tecto, alumiou as estantes monumentaes, todas d’ebano. N’ellas repousavam mais de trinta mil volumes, encadernados em branco, em escarlate, em negro, com retoques d’ouro, hirtos na sua pompa e na sua auctoridade como doutores n’um concilio."}, {"t": "p", "text": "Não contive a minha admiração:"}, {"t": "p", "text": "— Oh Jacintho! Que deposito!"}, {"t": "p", "text": "Elle murmurou, n’um sorriso descorado:"}, {"t": "p", "text": "— Ha que lêr, ha que lêr..."}, {"t": "p", "text": "Reparei então que o meu amigo emmagrecera: e que o nariz se lhe afilára mais entre duas rugas muito fundas, como as d’um comediante cançado. Os anneis do seu cabello lanigero rareavam sobre a testa, que perdera a antiga serenidade de marmore bem polido. Não frisava agora o bigode murcho, cahido em fios pensativos. Tambem notei que corcovava."}, {"t": "p", "text": "Elle erguêra uma tapeçaria — entramos no seu gabinete de trabalho, que me inquietou. Sobre a espessura dos tapetes sombrios os nossos passos perderam logo o som, e como a realidade. O damasco das paredes, os divans, as madeiras, eram verdes, d’um verde profundo de folha de louro. Sêdas verdes envolviam as luzes electricas, dispersas em lampadas tão baixas que lembravam estrellas cahidas por cima das mesas, acabando de arrefecer e morrer: só uma rebrilhava, núa e clara, no alto d’uma estante quadrada, esguia, solitaria como uma torre n’uma planicie, e de que o lume parecia ser o pharol melancolico. Um biombo de laca verde, fresco verde de relva, resguardava a chaminé de marmore verde, verde de mar sombrio, onde esmoreciam as brazas d’uma lenha aromatica. E entre aquelles verdes reluzia, por sobre peanhas e pedestaes, toda uma Mechanica sumptuosa, apparelhos, laminas, rodas, tubos, engrenagens, hastes, friezas, rigidezas de metaes..."}, {"t": "p", "text": "Mas Jacintho batia nas almofadas do divan, onde se enterrára com um modo cançado que eu não lhe conhecia:"}, {"t": "p", "text": "— Para aqui, Zé Fernandes, para aqui! É necessario reatarmos estas nossas vidas, tão apartadas ha sete annos!... Em Guiães, sete annos! Que fizeste tu?"}, {"t": "p", "text": "— E tu, que tens feito, Jacintho?"}, {"t": "p", "text": "O meu amigo encolheu mollemente os hombros. Vivêra — cumprira com serenidade todas as funcções, as que pertencem á materia e as que pertencem ao espirito..."}, {"t": "p", "text": "— E accumulaste civilisação, Jacintho! Santo Deus... Está tremendo, o 202!"}, {"t": "p", "text": "Elle espalhou em torno um olhar onde já não faiscava a antiga vivacidade:"}, {"t": "p", "text": "— Sim, ha confortos... Mas falta muito! A humanidade ainda está mal apetrechada, Zé Fernandes... E a vida conserva resistencias."}, {"t": "p", "text": "Subitamente, a um canto, repicou a campainha do telephone. E emquanto o meu amigo, curvado sobre a placa, murmurava impaciente «Está lá? — Está lá?», examinei curiosamente, sobre a sua immensa mesa de trabalho, uma estranha e miuda legião de instrumentosinhos de nickel, d’aço, de cobre, de ferro, com gumes, com argolas, com tenazes, com ganchos, com dentes, expressivos todos, de utilidades misteriosas. Tomei um que tentei manejar — e logo uma ponta malevola me picou um dedo. N’esse instante rompeu d’outro canto um «tic-tic-tic» açodado, quasi ancioso. Jacintho acudiu, com a face no telephone:."}, {"t": "p", "text": "— Vê ahi o telegrapho!... Ao pé do divan. Uma tira de papel que deve estar a correr."}, {"t": "p", "text": "E, com effeito, d’uma redôma de vidro posta n’uma columna, e contendo um apparelho esperto e diligente, escorria para o tapete, como uma tenia, a longa tira de papel com caracteres impressos, que eu, homem das serras, apanhei, maravilhado. A linha, traçada em azul, annunciava ao meu amigo Jacintho que a fragata russa Azoff entrára em Marselha com avaria!"}, {"t": "p", "text": "Já elle abandonára o telephone. Desejei saber, inquieto, se o prejudicava directamente aquella avaria da Azoff."}, {"t": "p", "text": "— Da Azoff?... A avaria? A mim?... Não! É uma noticia."}, {"t": "p", "text": "Depois, consultando um relogio monumental que, ao fundo da Bibliotheca, marcava a hora de todas as Capitaes e o curso de todos os Planetas:"}, {"t": "p", "text": "— Eu preciso escrever uma carta, seis linhas... Tu esperas, não, Zé Fernandes? Tens ahi os jornaes de Paris, da noite; e os de Londres, d’esta manhã. As Illustrações além, n’aquella pasta de couro com ferragens."}, {"t": "p", "text": "Mas eu preferi inventariar o gabinete, que dava á minha profanidade serrana todos os gostos d’uma iniciação. Aos lados da cadeira de Jacintho pendiam gordos tubos acusticos, por onde elle decerto soprava as suas ordens através do 202. Dos pés da mesa cordões tumidos e molles, colleando sobre o tapete, corriam para os recantos de sombra á maneira de cobras assustadas. Sobre uma banquinha, e reflectida no seu verniz como na agua d’um poço, pousava uma Machina-de-escrever: e adiante era uma immensa Machina-de-calcular, com fileiras de buracos d’onde espreitavam, esperando, numeros rigidos e de ferro. Depois parei em frente da estante que me preoccupava, assim solitaria, á maneira d’uma torre n’uma planicie, com o seu alto pharol. Toda uma das suas faces estava repleta de Diccionarios; a outra de Manuaes; a outra de Atlas; a ultima de Guias, e entre elles, abrindo um folio, encontrei o Guia das ruas de Samarkande. Que macissa torre de informação! Sobre prateleiras admirei apparelhos que não comprehendia: — um composto de laminas de gelatina, onde desmaiavam, meio-chupadas, as linhas d’uma carta, talvez amorosa; outro, que erguia sobre um pobre livro brochado, como para o decepar, um cutello funesto; outro avançando a bocca d’uma tuba, toda aberta para as vozes do invisivel. Cingidos aos umbraes, liados ás cimalhas, luziam arames, que fugiam através do tecto, para o espaço. Todos mergulhavam em forças universaes, todos transmittiam forças universaes. A Natureza convergia disciplinada ao serviço do meu amigo e entrára na sua domesticidade!..."}, {"t": "p", "text": "Jacintho atirou uma exclamação impaciente:"}, {"t": "p", "text": "— Oh, estas pennas electricas!... Que secca!"}, {"t": "p", "text": "Amarrotára com colera a carta começada — eu escapei, respirando, para a Bibliotheca. Que magestoso armazem dos productos do Raciocinio e da Imaginação! Alli jaziam mais de trinta mil volumes, e todos decerto essenciaes a uma cultura humana. Logo á entrada notei, em ouro n’uma lombada verde, o nome de Adam Smith. Era pois a região dos Economistas. Avancei — e percorri, espantado, oito metros de Economia Politica. Depois avistei os Philosophos e os seus commentadores, que revestiam toda uma parede, desde as escólas Pre-socraticas até ás escólas Neo-pessimistas. N’aquellas pranchas se acastellavam mais de dois mil systemas — e que todos se contradiziam. Pelas encadernações logo se deduziam as doutrinas: Hobbes, em baixo, era pesado, de couro negro; Platão, em cima, resplandecia, n’uma pellica pura e alva. Para diante começavam as Historias Universaes. Mas ahi uma immensa pilha de livros brochados, cheirando a tinta nova e a documentos novos, subia contra a estante, como fresca terra d’alluvião tapando uma riba secular. Contornei essa collina, mergulhei na secção das Sciencias Naturaes, peregrinando, n’um assombro crescente, da Orographia para a Paleontologia, e da Morphologia para a Crystallographia. Essa estante rematava junto d’uma janella rasgada sobre os Campos Elyseos. Apartei as cortinas de velludo — e por traz descobri outra portentosa rima de volumes, todos de Historia Religiosa, de Exegese Religiosa, que trepavam montanhosamente até aos ultimos vidros, vedando, nas manhãs mais candidas, o ar e a luz do Senhor."}, {"t": "p", "text": "Mas depois rebrilhava, em marroquins claros, a estante amavel dos Poetas. Como um repouso para o espirito esfalfado de todo aquelle saber positivo, Jacintho aconchegára ahi um recanto, com um divan e uma mesa de limoeiro, mais lustrosa que um fino esmalte, coberta de charutos, de cigarros d’Oriente, de tabaqueiras do seculo XVIII. Sobre um cofre de madeira lisa pousava ainda, esquecido, um prato de damascos seccos do Japão. Cedi á seducção das almofadas; trinquei um damasco, abri um volume; e senti estranhamente, ao lado, um zumbido, como de um insecto de azas harmoniosas. Sorri á idéa que fossem abelhas, compondo o seu mel n’aquelle massiço de versos em flôr. Depois percebi que o susurro remoto e dormente vinha do cofre de mogne, de parecer tão discreto. Arredei uma Gazeta de França; e descornitei um cordão que emergia de um orificio, escavado no cofre, e rematava n’um funil de marfim. Com curiosidade, encostei o funil a esta minha confiada orelha, afeita á singeleza dos rumores da serra. E logo uma Voz, muito mansa, mas muito dicidida, aproveitando a minha curiosidade para me invadir e se apoderar do meu entendimento, susurrou capciosamente:"}, {"t": "p", "text": "— ...«E assim, pela disposição dos cubos diabolicos, eu chego a verificar os espaços hypermagicos!...»"}, {"t": "p", "text": "Pulei, com um berro."}, {"t": "p", "text": "— Oh Jacintho, aqui ha um homem! Está aqui um homem a fallar dentro d’uma caixa!"}, {"t": "p", "text": "O meu camarada, habituado aos prodigios, não se alvoroçou:"}, {"t": "p", "text": "— É o Conferençophone... Exactamente como o Theatrophone; sómente applicado ás escólas e ás conferencias. Muito commodo!... Que diz o homem, Zé Fernandes?"}, {"t": "p", "text": "Eu considerava o cofre, ainda esgazeado:"}, {"t": "p", "text": "— Eu sei! Cubos diabolicos, espaços magicos, toda a sorte de horrores..."}, {"t": "p", "text": "Senti dentro o sorriso superior de Jacintho:."}, {"t": "p", "text": "— Ah, é o coronel Dorchas... Lições de Metaphysica Positiva sobre a Quarta Dimensão... Conjecturas, uma massada! Ouve lá, tu hoje jantas commigo e com uns amigos, Zé Fernandes?"}, {"t": "p", "text": "— Não, Jacintho... Estou ainda enfardelado pelo alfaiate da serra!"}, {"t": "p", "text": "E voltei ao gabinete mostrar ao meu camarada o jaquetão de flanella grossa, a gravata de pintinhas escarlates, com que ao domingo, em Guiães, visitava o Senhor. Mas Jacintho affirmou que esta simplicidade montesina interessaria os seus convidados, que eram dois artistas... Quem? O auctor do Coração Triplo, um Psychologo Feminista, d’agudeza transcendente, Mestre muito experimentado e muito consultado em Sciencias Sentimentaes; e Vorcan, um pintor mythico, que interpretára ethereamente, havia um anno, a symbolia rapsodica do cerco de Troia, n’uma vasta composição, Helena Devastadora..."}, {"t": "p", "text": "Eu coçava a barba:"}, {"t": "p", "text": "— Não, Jacintho, não... Eu venho de Guiães, das serras; preciso entrar em toda esta civilisacão, lentamente, com cautella, senão rebento. Logo na mesma tarde a electricidade, e o conferençophone, e os espaços hypermagicos e o feminista, e o ethereo, e a symbolia devastadora, é excessivo! Volto ámanhã.."}, {"t": "p", "text": "Jacintho dobrava vagarosamente a sua carta, onde mettera sem rebuço (como convinha á nossa fraternidade) duas violetas brancas tiradas do ramo que lhe floria o peito."}, {"t": "p", "text": "— Ámanhã, Zé Fernandes, tu vens antes d’almoço, com as tuas malas dentro d’um fiacre, para te installares no 202, no teu quarto. No Hotel são embaraços, privações. Aqui tens o telephone, o teatrophone, livros..."}, {"t": "p", "text": "Acceitei logo, com simplicidade. E Jacintho, embocando um tubo acustico, murmurou:"}, {"t": "p", "text": "— Grillo!"}, {"t": "p", "text": "Da parede, recoberta de damasco, que subitamente e sem rumor se fendeu, surdio o seu velho escudeiro (aquelle moleque que viera com D. Gallião), que eu me alegrei de encontrar tão rijo, mais negro, reluzente e veneravel na sua tesa gravata, no seu collete branco de botões de ouro. Elle tambem estimou vêr de novo «o siô Fernandes». E, quando soube que eu occuparia o quarto do avô Jacintho, teve um claro sorriso de preto, em que envolveu o seu senhor, no contentamento de o sentir emfim reprovido d’uma familia."}, {"t": "p", "text": "— Grillo, dizia Jacintho, esta carta a Madame de Oriol... Escuta! Telephona para casa dos Trèves que os espiritistas só estão livres no domingo... Escuta! Eu tomo uma douche antes de jantar, tepida, a 17. Fricção com malva-rosa."}, {"t": "p", "text": "E cahindo pesadamente para cima do divan, com um bocejo arrastado e vago:"}, {"t": "p", "text": "— Pois é verdade, meu Zé Fernandes, aqui estamos, como ha sete annos, n’este velho Paris..."}, {"t": "p", "text": "Mas eu não me arredava da mesa, no desejo de completar a minha iniciação:"}, {"t": "p", "text": "— Oh Jacintho, para que servem todos estes instrumentosinhos? Houve já ahi um desavergonhado que me picou. Parecem perversos... São uteis?"}, {"t": "p", "text": "Jacintho esboçou, com languidez, um gesto que os sublimava. — Providenciaes, meu filho, absolutamente providenciaes, pela simplificação que dão ao trabalho! Assim... E apontou. Este arrancava as pennas velhas; o outro numerava rapidamente as paginas d’um manuscripto; aquell’outro, além, raspava emendas... E ainda os havia para collar estampilhas, imprimir datas, derreter lacres, cintar documentos..."}, {"t": "p", "text": "— Mas com effeito, accrescentou, é uma sécca. Com as molas, com os bicos, ás vezes magoam, ferem... Já me succedeu inutilisar cartas por as ter sujado com dedadas de sangue. É uma massada!"}, {"t": "p", "text": "Então, como o meu amigo espreitára novamente o relogio monumental, não lhe quiz retardar a consolação da douche e da malva-rosa."}, {"t": "p", "text": "— Bem, Jacintho, já te revi, já me contentei... Agora até ámanhã, com as malas."}, {"t": "p", "text": "— Que diabo, Zé Fernandes, espera um momento... Vamos pela sala de jantar. Talvez te tentes!"}, {"t": "p", "text": "E, através da Bibliotheca, penetramos na sala de jantar, — que me encantou pelo seu luxo sereno e fresco. Uma madeira branca, laccada, mais lustrosa e macia que setim, revestia as paredes, encaixilhando medalhões de damasco côr de morango, de morango muito maduro e esmagado: os aparadores, discretamente lavrados em florões e rocalhas, resplandeciam com a mesma lacca nevada: e damascos amorangados estofavam tambem as cadeiras, brancas, muito amplas, feitas para a lentidão de gulas delicadas, de gulas intellectuaes."}, {"t": "p", "text": "— Viva o meu Principe! Sim senhor... Eis aqui um comedoiro muito comprehensivel e muito repousante, Jacintho!"}, {"t": "p", "text": "— Então janta, homem!"}, {"t": "p", "text": "Mas já eu me começava a inquietar, reparando que a cada talher correspondiam seis garfos, e todos de feitios astuciosos. E mais me impressionei quando Jacintho me desvendou que um era para as ostras, outro para o peixe, outro para as carnes, outro para os legumes, outro para as fructas, outro para o queijo! Simultaneamente, com uma sobriedade que louvaria Salomão, só dois copos, para dois vinhos: — um Bordeus rosado em infusas de crystal, e Champagne gelando dentro de baldes de prata. Todo um aparador porém vergava, sob o luxo redundante, quasi assustador d’aguas — aguas oxigenadas, aguas carbonatadas, aguas phosphatadas, aguas esterilisadas, aguas de saes, outras ainda, em garrafas bojudas, com tratados therapeuticos impressos em rotulos."}, {"t": "p", "text": "— Santissimo nome de Deus, Jacintho! Então és ainda o mesmo tremendo bebedor d’agua, hein?... Un aquatico! como dizia o nosso poeta chileno, que andava a traduzir Klopstock."}, {"t": "p", "text": "Elle derramou, por sobre toda aquella garrafaria encarapuçada em metal, um olhar desconsolado:"}, {"t": "p", "text": "— Não... É por causa das aguas da Cidade, contaminadas, atulhadas de microbios... Mas ainda não encontrei uma bôa agua que me convenha, que me satisfaça... Até soffro sêde."}, {"t": "p", "text": "Desejei então conhecer o jantar do Psychologo e do Symbolista — traçado, ao lado dos talheres, em tinta vermelha, sobre laminas de marfim. Começava honradamente por ostras classicas, de Marennes. Depois apparecia uma sopa d’alcachofras e ovas de carpa..."}, {"t": "p", "text": "— É bom?"}, {"t": "p", "text": "Jacintho encolheu desinteressadamente os hombros:"}, {"t": "p", "text": "— Sim... Eu não tenho nunca appetite, já ha tempos... Já ha annos."}, {"t": "p", "text": "Do outro prato só comprehendi que continha frangos e tubaras. Depois saboreariam aquelles senhores um filete de veado, macerado em Xerez, com gelêa de noz. E por sobremeza simplesmente laranjas geladas em ether."}, {"t": "p", "text": "— Em ether, Jacintho?"}, {"t": "p", "text": "O meu amigo hesitou, esboçou com os dedos a ondulação d’um aroma que s’evola."}, {"t": "p", "text": "— É novo... Parece que o ether desenvolve, faz afflorar a alma das fructas..."}, {"t": "p", "text": "Curvei a cabeça ignara, murmurei nas minhas profundidades:"}, {"t": "p", "text": "— Eis a Civilisação!"}, {"t": "p", "text": "E, descendo os Campos Elyseos, encolhido no paletot, a cogitar n’este prato symbolico, considerava a rudeza e atolado atrazo da minha Guiães, onde desde seculos a alma das laranjas permanece ignorada e desaproveitada dentro dos gomos sumarentos, por todos aquelles pomares que ensombram e perfumam o valle, da Roqueirinha a Sandofim! Agora porém, bemdito Deus, na convivencia de um tão grande iniciado como Jacintho, eu comprehenderia todas as finuras e todos os poderes da Civilisação."}, {"t": "p", "text": "E, (melhor ainda para a minha ternura!) contemplaria a raridade d’um homem que, concebendo uma idéa da Vida, a realisa — e através d’ella e por ella recolhe a felicidade perfeita."}, {"t": "p", "text": "Bem se affirmára este Jacintho, na verdade, como Principe da Gran-Ventura!"}]}, {"title": "A Cidade e as Serras/III", "url": "https://pt.wikisource.org/wiki/A_Cidade_e_as_Serras/III", "paras": [{"t": "h", "text": "III"}, {"t": "p", "text": "No 202, todas as manhãs, ás nove horas, depois do meu chocolate e ainda em chinelas, penetrava no quarto de Jacintho. Encontrava o meu amigo banhado, barbeado, friccionado, envolto n’um roupão branco de pello de cabra do Thibet, diante da sua mesa de toilette, toda de crystal, (por causa dos microbios) e atulhada com esses utensilios de tartaruga, marfim, prata, aço e madreperola que o homem do seculo XIX necessita para não desfeiar o conjuncto sumptuario da Civilisação e manter n’ella o seu Typo. As escovas sobretudo renovavam, cada dia, o meu regalo e o meu espanto — porque as havia largas como a roda massiça d’um carro sabino; estreitas e mais recurvas que o alfange d’um mouro; concavas, em fórma de telha aldeã; ponteagudas em feitio de folha de hera; rijas que nem cerdas de javali; macias que nem pennugem de rôla! De todas, fielmente, como amo que não desdenha nenhum servo, se utilisava o meu Jacintho. E assim, em face ao espelho emmoldurado de folhedos de prata, permanecia este Principe passando pellos sobre o seu pello durante quatorze minutos."}, {"t": "p", "text": "No emtanto o Grillo e outro escudeiro, por traz dos biombos de Kioto, de sedas lavradas, manobravam, com pericia e vigor, os apparelhos do lavatorio — que era apenas um resumo das machinas monumentaes da Sala de Banho, a mais estremada maravilha do 202. N’estes marmores simplificados existiam unicamente dois jactos graduados desde zero até cem; as duas duchas, fina e grossa, para a cabeça; a fonte esterilisada para os dentes; o repuxo borbulhante para a barba; e ainda botões discretos, que, roçados, desencadeavam esguichos, cascatas cantantes, ou um leve orvalho estival. D’esse recanto temeroso, onde delgados tubos mantinham em disciplina e servidão tantas aguas ferventes, tantas aguas violentas, sahia emfim o meu Jacintho enxugando as mãos a uma toalha de felpo, a uma toalha de linho, a outra de corda entrançada para restabelecer a circulação, a outra de sêda frouxa para repolir a pelle. Depois d’este rito derradeiro que lhe arrancava ora um suspiro, ora um bocejo, Jacintho, estendido n’um divan, folheava uma Agenda, onde se arrolavam, inscriptas pelo Grillo ou por elle, as occupações do seu dia, tão numerosas por vezes que cobriam duas laudas."}, {"t": "p", "text": "Todas ellas se prendiam á sua sociabilidade, á sua civilisação muito complexa, ou a interesses que o meu Principe, n’esses sete annos, creára para viver em mais consciente communhão com todas as funcções da Cidade. (Jacintho com effeito era presidente do Club da Espada e Alvo; commanditario do Jornal o Boulevard; director da Companhia dos Telephones de Constantinopla; socio dos Bazares unidos da Arte Espiritualista; membro do Comité de Iniciação das Religiões Esotericas, etc.) Nenhuma d’estas occupações parecia porém aprazivel ao meu amigo — porque, apesar da mansidão e harmonia dos seus modos, frequentemente arremessava para o tapete, n’uma rebellião de homem livre, aquella Agenda que o escravisava. E n’uma d’essas manhãs (de vento e neve), apanhando eu o livro oppressivo, encadernado em pellica, de um carinhoso tom de rosa murcha — descobri que o meu Jacintho devia depois do almoço fazer uma visita na rua da Universidade, outra no Parque Monceau, outra entre os arvoredos remotos da Muette; assistir por fidelidade a uma votação no Club; acompanhar Madame d’Oriol a uma exposição de leques; escolher um presente de noivado para a sobrinha dos Trèves; comparecer no funeral do velho conde de Malville; presidir um tribunal de honra n’uma questão de roubalheira, entre cavalheiros, ao ecarté... E ainda se acavallavam outras indicações, escrivinhadas por Jacintho a lapis: — «Carroceiro — Five-oclock dos Ephrains — A pequena das Variedades — Levar a nota ao jornal...» Considerei o meu Principe. Estirado no divan, d’olhos miserrimamente cerrados, bocejava, n’um bocejo immenso e mudo."}, {"t": "p", "text": "Mas os affazeres de Jacintho começavam logo no 202, cedo, depois do banho. Desde as oito horas a campainha do telephone repicava por elle, com impaciencia, quasi com colera, como por um escravo tardio. E mal enxugado, dentro do seu roupão de pello de cabra do Thibet ou de grossas pyjamas de pelucia côr d’ouro-velho, constantemente sahia ao corredor a cochichar com sujeitos tão apressados, que conservavam na mão o guarda-chuva pingando sobre o tapete. Um d’esses, sempre presente (e que pertencia decerto aos Telephones de Constantinopla), era temeroso — todo elle chupado, tisnado, com maus dentes, sobraçando uma enorme pasta sebenta, e dardejando, d’entre a alta gola d’uma pelissa poida, como da abertura d’um covil, dous olhinhos tôrvos e de rapina. Sem cessar, inexoravelmente, um escudeiro apparecia, com bilhetes n’uma salva... Depois eram fornecedores d’Industria e d’Arte; negociantes de cavallos, rubicundos e de paletot branco; inventores com grossos rolos de papel; alfarrabistas trazendo na algibeira uma edição «unica», quasi inverosimil, de Ulrich Zell ou do Lapidanus. Jacintho circulava estonteado pelo 202, rabiscando a carteira, repicando o telephone, desatando nervosamente pacotes, sacudindo ao passar algum embuscado que surdia das sombras da antecamara, estendia como um trabuco o seu memorial ou o seu catalogo!"}, {"t": "p", "text": "Ao meio dia, um tam-tam argentino e melancholico ressoava, chamando ao almoço. Com o Figaro ou as Novidades abertas sobre o prato, eu esperava sempre meia hora pelo meu Principe, que entrava n’uma rajada, consultando o relogio, exhalando com a face moída o seu queixume eterno:"}, {"t": "p", "text": "— Que massada! E depois uma noite abominavel, enrodilhada em sonhos... Tomei sulforal, chamei o Grillo para me esfregar com therebentina... Uma sécca!"}, {"t": "p", "text": "Espalhava pela mesa um olhar já farto. Nenhum prato, por mais engenhoso, o seduzia; — e, como através do seu tumulto matinal fumava incontaveis cigarretes que o resequiam, começava por se encharcar com um immenso copo d’agua oxygenada, ou carbonatada, ou gazoza, misturada d’um cognac raro, muito caro, horrendamente adocicado, de moscatel de Syracusa. Depois, á pressa, sem gosto, com a ponta incerta do garfo, picava aqui e além uma lasca de fiambre, uma febra de lagosta; — e reclamava impacientemente o café, um café de Moka, mandado cada mez por um feitor do Dedjah, fervido á turca, muito espesso, que elle remexia com um pau de canella!"}, {"t": "p", "text": "— E tu, Zé Fernandes, que vaes tu fazer?"}, {"t": "p", "text": "— Eu?"}, {"t": "p", "text": "Recostado na cadeira, com delicias, os dedos mettidos nas cavas do collete:"}, {"t": "p", "text": "— Vou vadiar, regaladamente, como um cão natural!"}, {"t": "p", "text": "O meu sollicito amigo, remexendo o café com o pau de canella, rebuscava através da numerosa Civilisação da Cidade uma occupação que me encantasse. Mas apenas suggeria uma Exposição, ou uma Conferencia, ou monumentos, ou passeios, logo encolhia os hombros desconsolados:"}, {"t": "p", "text": "— Por fim nem vale a pena, é uma sécca!"}, {"t": "p", "text": "Accendia outra das cigarretes russas, onde rebrilhava o seu nome, impresso a ouro na mortalha. Torcendo, n’uma pressa nervosa, os fios do bigode, ainda escutava, á porta da Bibliotheca, o seu procurador, o nedio e magestoso Laporte. E emfim, seguido d’um criado, que sobraçava um maço tremendo de jornaes para lhe abastecer o coupé, o Principe da Gran-Ventura mergulhava na Cidade."}, {"t": "p", "text": "Quando o dia social de Jacintho se apresentava mais desafogado, e o céo de Março nos concedia caridosamente um pouco de azul agoado, sahiamos depois d’almoço, a pé, através de Paris. Estes lentos e errantes passeios eram outr’ora, na nossa edade de Estudantes, um gozo muito querido de Jacintho — porque n’elles mais intensamente e mais minuciosamente saboreava a Cidade. Agora porém, apesar da minha companhia, só lhe davam uma impaciencia e uma fadiga que desoladoramente destoava do antigo, illuminado extasi. Com espanto (mesmo com dôr, porque sou bom, e sempre me entristece o desmoronar d’uma crença) descobri eu, na primeira tarde em que descemos aos Boulevards, que o denso formigueiro humano sobre o asphalto, e a torrente sombria dos trens sobre o macadam, affligiam o meu amigo pela brutalidade da sua pressa, do seu egoismo, e do seu estridor. Encostado e como refugiado no meu braço, este Jacintho novo começou a lamentar que as ruas, na nossa Civilisação, não fossem calçadas de gutta-percha! E a gutta-percha claramente representava, para o meu amigo, a substancia discreta que amortece o choque e a rudeza das cousas. Oh maravilha! Jacintho querendo borracha, a borracha isoladora, entre a sua sensibilidade e as funcções da Cidade! Depois, nem me permittiu pasmar diante d’aquellas dourejadas e espelhadas lojas que elle outr’ora considerava como os «preciosos museus do seculo XIX»..."}, {"t": "p", "text": "— Não vale a pena, Zé Fernandes. Ha uma immensa pobreza e seccura d’invenção! Sempre os mesmos florões Luiz XV, sempre as mesmas pelucias... Não vale a pena!"}, {"t": "p", "text": "Eu arregalava os olhos para este transformado Jacintho. E sobretudo me impressionava o seu horror pela Multidão — por certos effeitos da Multidão, só para elle sensiveis, e a que chamava os «sulcos»."}, {"t": "p", "text": "— Tu não os sentes, Zé Fernandes. Vens das serras... Pois constituem o rijo inconveniente das Cidades, estes sulcos! É um perfume muito agudo e petulante que uma mulher larga ao passar, e se installa no olfacto, e estraga para todo o dia o ar respiravel. É um dito que se surprehende n’um grupo, que revela um mundo de velhacaria, ou de pedantismo, ou de estupidez, e que nos fica collado á alma, como um salpico, lembrando a immensidade da lama a atravessar. Ou então, meu filho, é uma figura intoleravel pela pretenção, ou pelo mau-gosto, ou pela impertinencia, ou pela rellice, ou pela dureza, e de que se não póde sacudir mais a visão repulsiva... Um pavor, estes sulcos, Zé Fernandes! De resto, que diabo, são as pequeninas miserias d’uma Civilisação deliciosa!"}, {"t": "p", "text": "Tudo isto era especioso, talvez pueril — mas para mim revelava, n’aquelle chamejante devoto da Cidade, o arrefecimento da devoção. N’essa mesma tarde, se bem recordo, sob uma luz macia e fina, penetramos nos centros de Paris, nas ruas longas, nas milhas de casario, todo de caliça parda, erriçado de chaminés de lata negra, com as janellas sempre fechadas, as cortininhas sempre corridas, abafando, escondendo a vida. Só tijolo, só ferro, só argamassa, só estuque: linhas hirtas, angulos asperos: tudo secco, tudo rigido. E dos chãos aos telhados, por toda a fachada, tapando as varandas, comendo os muros, Taboletas, Taboletas..."}, {"t": "p", "text": "— Oh, este Paris, Jacintho, este teu Paris! Que enorme, que grosseiro bazar!"}, {"t": "p", "text": "E, mais para sondar o meu Principe do que por persuasão, insisti na fealdade e tristeza d’estes predios, duros armazens, cujos andares são prateleiras onde se apilha humanidade! E uma humanidade impiedosamente catalogada e arrumada! A mais vistosa e de luxo nas prateleiras baixas, bem envernisadas. A relles e de trabalho nos altos, nos desvãos, sobre pranchas de pinho nú, entre o pó e a traça..."}, {"t": "p", "text": "Jacintho murmurou, com a face arripiada:"}, {"t": "p", "text": "— É feio, é muito feio!"}, {"t": "p", "text": "E accudiu logo, sacudindo no ar a luva de anta:"}, {"t": "p", "text": "— Mas que maravilhoso organismo, Zé Fernandes! Que solidez! Que producção!"}, {"t": "p", "text": "Onde Jacintho me parecia mais renegado era na sua antiga e quasi religiosa affeição pelo Bosque de Bolonha. Quando moço, elle construira sobre o Bosque theorias complicadas e consideraveis. E sustentava, com olhos rutilantes de fanatico, que no Bosque a Cidade cada tarde ia retemperar salutarmente a sua força, recebendo, pela presença das suas Duquezas, das suas Cortezãs, dos seus Politicos, dos seus Financeiros, dos seus Generaes, dos seus Academicos, dos seus Artistas, dos seus Clubistas, dos seus Judeus, a certeza consoladora de que todo o seu pessoal se mantinha em numero, em vitalidade, em funcção, e que nenhum elemento da sua grandeza desapparecera ou deperecera! «Ir ao Bois» constituia então para o meu Principe um acto de consciencia. E voltava sempre confirmando com orgulho que a Cidade possuia todos os seus astros, garantindo a eternidade da sua luz!"}, {"t": "p", "text": "Agora, porém, era sem fervor, arrastadamente, que elle me levava ao Bosque, onde eu, aproveitando a clemencia d’Abril, tentava enganar a minha saudade d’arvoredos. Emquanto subiamos, ao trote nobre das suas egoas lustrosas, a Avenida dos Campos-Elyseos e a do Bosque, rejuvenescidas pelas relvas tenras e fresco verdejar dos rebentos, Jacintho, soprando o fumo da cigarrete pelas vidraças abertas do coupé, permanecia o bom camarada, de veia amavel, com quem era doce philosophar através de Paris. Mas logo que passavamos as grades douradas do Bosque, e penetravamos na Avenida das Acacias, e enfiavamos na lenta fila dos trens de luxo e de praça, sob o silencio decoroso, apenas cortado pelo tilintar dos freios e pelas rodas vagarosas esmagando a areia, — o meu Principe emmudecia, mollemente engilhado no fundo das almofadas, d’onde só despegava a face para escancarar bocejos de fartura. Pelo antigo habito de verificar a presença confortadora do «pessoal, dos astros», ainda, por vezes, apontava para algum coupé ou vittoria rodando com rodar rangente n’outra arrastada fila — e murmurava um nome. E assim fui conhecendo a encaracolada barba hebraica do banqueiro Ephraim; e o longo nariz patricio de Madame de Trèves abrigando um sorriso perenne; e as bochechas flacidas do poeta neo-platonico Dornan, sempre espapado no fundo de fiacres; e os longos bandòs pre-raphaelitas e negros de Madame Verghane; e o monoculo defumado do director do Boulevard; e o bigodinho vencedor do Duque de Marizac, reinando de cima do seu phaeton de guerra; e ainda outros sorrisos immoveis, e barbichas á Renascença, e palpebras amortecidas, e olhos farejantes, e pelles empoadas d’arroz, que eram todas illustres e da intimidade do meu Principe. Mas, do topo da Avenida das Acacias, recomeçavamos a descer, em passo sopeado, esmagando lentamente a areia; na fila vagarosa que subia, calhambeque atraz de landau, vittoria atraz de fiacre, fatalmente reviamos o binoculo sombrio do homem do Boulevard, e os bandòs furiosamente negros de Madame Verghane, e o ventre espapado do neo-platonico, e a barba talmudica, e todas aquellas figuras, d’uma immobilidade de cera, super-conhecidas do meu camarada, recruzadas cada tarde através de revividos annos, sempre com os mesmos sorrisos, sob o mesmo pó d’arroz, na mesma immobilidade de cera; então Jacintho não se continha, gritava ao cocheiro:"}, {"t": "p", "text": "— Para casa, depressa!"}, {"t": "p", "text": "E era pela Avenida do Bosque, pelos Campos-Elyseos, uma fuga ardente das egoas a quem a lentidão sopeada, n’um roer de freios, entre outras egoas tambem d’ellas super-conhecidas, lançavam n’uma exasperação comparavel á de Jacintho."}, {"t": "p", "text": "Para o sondar eu denegria o Bosque:"}, {"t": "p", "text": "— Já não é tão divertido, perdeu o brilho!..."}, {"t": "p", "text": "Elle acudia, timidamente:"}, {"t": "p", "text": "— Não, é agradavel, não ha nada mais agradavel; mas..."}, {"t": "p", "text": "E accusava a friagem das tardes ou o despotismo dos seus affazeres. Recolhiamos então ao 202, onde, com effeito, em breve embrulhado no seu roupão branco, diante da mesa de crystal, entre a legião das escovas, com toda a electricidade refulgindo, o meu Principe se começava a adornar para o serviço social da noite."}, {"t": "p", "text": "E foi justamente numa d’essas noites (um sabado) que nós passamos, n’aquelle quarto tão civilisado e protegido, por um d’esses brutos e revoltos terrores como só os produz a ferocidade dos Elementos. Já tarde, á pressa (jantavamos com Marizac no Club para o acompanhar depois ao Lohengrin na Opera) Jacintho arrocheava o nó da gravata branca — quando no lavatorio, ou porque se rompesse o tubo, ou se dessoldasse a torneira, o jacto d’agua a ferver rebentou furiosamente, fumegando e silvando. Uma nevoa densa de vapor quente abafou as luzes — e, perdidos n’ella, sentiamos, por entre os gritos do escudeiro e do Grillo, o jorro devastador batendo os muros, esparrinhando uma chuva que escaldava. Sob os pés o tapete ensopado era uma lama ardente. E como se todas as forças da natureza, submettidas ao serviço de Jacintho, se agitassem, animadas por aquella rebellião da agua — ouvimos roncos surdos no interior das paredes, e pelos fios dos lumes electricos sulcaram faiscas ameaçadoras! Eu fugira para o corredor, onde se alargava a nevoa grossa. Por todo o 202 ia um tumulto de desastre. Diante do portão, attrahidas pela fumarada que se escapava das janellas, estacionava policia, uma multidão. E na escada esbarrei com um reporter, de chapéo para a nuca, a carteira aberta, gritando sofregamente «se havia mortos?»"}, {"t": "p", "text": "Domada a agua, clareada a bruma, vim encontrar Jacintho no meio do quarto, em ceroulas, livido:"}, {"t": "p", "text": "— Oh Zé Fernandes, esta nossa industria!... Que impotencia, que impotencia! Pela segunda vez, este desastre! E agora, apparelhos perfeitos, um processo novo..."}, {"t": "p", "text": "— E eu encharcado por esse processo novo! E sem outra casaca!"}, {"t": "p", "text": "Em redor, as nobres sêdas bordadas, os brocateis Luiz XIII, cobertos de manchas negras, fumegavam. O meu Principe, enfiado, enchugava uma photographia de Madame d’Oriol, d’hombros decotados, que o jorro bruto maculára d’empolas. E eu, com rancor, pensava que na minha Guiães a agua aquecia em seguras panellas — e subia ao meu lavatorio, pela mão forte da Catharina, em seguras infusas! Não jantamos com o duque de Marizac, no Club. E, na Opera, nem saboreei Lohengrin e a sua branca alma e o seu branco cysne e as suas brancas armas — entallado, aperreado, cortado nos sovacos pela casaca que Jacintho me emprestára e que rescendia estonteadoramente a flores de Nessari."}, {"t": "p", "text": "No domingo, muito cedo, o Grillo, que na véspera escaldára as mãos e as trazia embrulhadas em sêda, penetrou no meu quarto, descerrou as cortinas, e á beira do leito, com o seu radiante sorriso de preto:"}, {"t": "p", "text": "— Vem no Figaro!"}, {"t": "p", "text": "Desdobrou triumphalmente o jornal. Eram, nos Echos, doze linhas, onde as nossas aguas rugiam e espadavam, com tanta magnificencia e tanta publicidade, que tambem sorrí, deleitado."}, {"t": "p", "text": "— E toda a manhã, o telephone, siô Fernandes! exclamava o Grillo, rebrilhando em ebano. A quererem saber, a quererem saber... «Está lá? Está escaldado?» Paris afflicto, siô Fernandes!"}, {"t": "p", "text": "O telephone, com effeito, repicava, insaciavel. E quando desci para o almoço, a toalha desapparecia sob uma camada de telegrammas, que o meu Principe fendia com a faca, enrugado, rosnando contra a «massada». Só desannuviou, ao ler um d’esses papeis azues, que atirou para cima do meu prato, com o mesmo sorriso agradado com que de manhã sorriramos, o Grillo e eu:"}, {"t": "p", "text": "— É do Gran-Duque Casimiro... Ratão amavel! Coitado!"}, {"t": "p", "text": "Saboreei, através dos ovos, o telegramma de S. Alteza. «O que! o meu Jacintho inundado! Muito chic, nos Campos-Elyseos! Não volto ao 202 sem boia de salvação! Compassivo abraço! Casimiro...» Murmurei tambem com deferencia: — «Amavel! Coitado!» Depois, revolvendo lentamente o montão de telegrammas que se alastrava até ao meu copo:"}, {"t": "p", "text": "— Oh Jacintho! Quem é esta Diana que incessantemente te escreve, te telephona, te telegrapha, te...?"}, {"t": "p", "text": "— Diana?... Diana de Lorge. É uma cocotte. É uma grande cocotte!"}, {"t": "p", "text": "— Tua?"}, {"t": "p", "text": "— Minha, minha... Não! tenho um bocado."}, {"t": "p", "text": "E como eu lamentava que o meu Principe, senhor tão rico e de tão fino orgulho, por economia d’uma gamella propria chafurdasse com outros n’uma gamella publica — Jacintho levantou os hombros, com um camarão espetado no garfo:"}, {"t": "p", "text": "— Tu vens das serras... Uma cidade como Paris, Zé Fernandes, precisa ter cortezãs de grande pompa e grande fausto. Ora para montar em Paris, n’esta tremenda carestia de Paris, uma cocotte com os seus vestidos, os seus diamantes, os seus cavallos, os seus lacaios, os seus camarotes, as suas festas, o seu palacete, a sua publicidade, a sua insolencia, é necessario que se aggremiem umas poucas de fortunas, se forme um syndicato! Somos uns sete, no Club. Eu pago um bocado... Mas meramente por Civismo, para dotar a cidade com uma cocotte monumental. De resto não chafurdo. Pobre Diana!... Dos hombros para baixo nem sei se tem a pelle côr de neve ou côr de limão."}, {"t": "p", "text": "Arregalei um olho divertido:"}, {"t": "p", "text": "— Dos hombros para baixo?... E para cima?"}, {"t": "p", "text": "— Oh para cima tem pó d’arroz!... Mas é uma sécca! Sempre bilhetes, sempre telephones, sempre telegrammas. E tres mil francos por mez, além das flores... Uma massada!"}, {"t": "p", "text": "E as duas rugas do meu Principe, aos lados do seu afilado nariz, curvado sobre a salada, eram como dous valles muito tristes, ao entardecer."}, {"t": "p", "text": "Acabavamos o almoço, quando um escudeiro, muito discretamente, n’um murmurio, annunciou Madame d’Oriol. Jacintho pousou com tranquillidade o charuto; eu quasi me engasguei, n’um sorvo alvoroçado de café. Entre os reposteiros de damasco côr de morango ella appareceu, toda de negro, d’um negro liso e austero de Semana Santa, lançando com o regalo um lindo gesto para nos socegar. E immediatamente, n’uma volubilidade docemente chalrada:"}, {"t": "p", "text": "— É um momento, nem se levantem! Passei, ia para a Magdalena, não me contive, quiz vêr os estragos... Uma inundação em Paris, nos Campos-Elyseos! Não ha senão este Jacintho. E vem no Figaro! O que eu estava assustada, quando telephonei! Imaginem! Agua a ferver, como no Vesuvio... Mas é d’uma novidade! E os estofos perdidos, naturalmente, os tapetes... Estou morrendo por admirar as ruinas!"}, {"t": "p", "text": "Jacintho, que não me pareceu commovido, nem agradecido com aquelle interesse, retomára risonhamente o charuto:"}, {"t": "p", "text": "— Está tudo secco, minha querida senhora, tudo secco! A belleza foi hontem, quando a agua fumegava e rugia! Ora que pena não ter ao menos cahido uma parede!"}, {"t": "p", "text": "Mas ella insistia. Nem todos os dias se gozavam em Paris os destroços d’uma inundação. O Figaro contára... E era uma aventura deliciosa, uma casa escaldada nos Campos-Elyseos!"}, {"t": "p", "text": "Toda a sua pessoa, desde as plumasinhas que frisavam no chapéo até á ponta reluzente das botinas de verniz, se agitava, vibrava, como um ramo tenro sob o boliço do passaro a chalrar. Só o sorriso, por traz do véo espesso, conservava um brilho immovel. E já no ar se espalhára um aroma, uma doçura, emanadas de toda a sua mobilidade e de toda a sua graça."}, {"t": "p", "text": "Jacintho no emtanto cedera, alegremente: e pelo corredor Madame d’Oriol ainda louvava o Figaro amavel, e confessava quanto tremera... Eu voltei ao meu café, felicitando mentalmente o Principe da Gran-Ventura por aquella perfeita flôr de Civilisação que lhe perfumava a vida. Pensei então na apurada harmonia em que se movia essa flôr. E corri vivamente á ante-camara, verificar diante do espelho o meu penteado e o nó da minha gravata. Depois recolhi á sala de jantar, e junto da janella, folheando languidamente a Revista do Seculo XIX, tomei uma attitude de elegancia e d’alta cultura. Quasi immediatamente elles reappareceram: e Madame d’Oriol, que, sempre sorrindo, se proclamava espoliada, nada encontrára que recordasse as agoas furiosas, roçou pela mesa, onde Jacintho procurava, para lhe offerecer, tangerinas de Malta, ou castanhas geladas, ou um biscouto molhado em vinho de Tokai."}, {"t": "p", "text": "Ella recusava com as mãos guardadas no regalo. Não era alta, nem forte — mas cada prega do vestido, ou curva da capa, cahia e ondulava harmoniosamente, como perfeições recobrindo perfeições. Sob o véo cerrado, apenas percebi a brancura da face empoada, e a escuridão dos olhos largos. E com aquellas sêdas e velludos negros, e um pouco do cabello louro, d’um louro quente, torcido fortemente sobre as pelles negras que lhe orlavam o pescoço, toda ella derramava uma sensação de macio e de fino. Eu teimosamente a considerava como uma flôr de Civilisação: — e pensava no secular trabalho e na cultura superior que necessitára o terreno onde ella tão delicadamente brotára, já desabrochada, em pleno perfume, mais graciosa por ser flôr d’esforço e d’estufa, e trazendo nas suas pétalas um não sei quê de desbotado e de ante-murcho."}, {"t": "p", "text": "No emtanto, com a sua volubilidade de passaro, chalrando para mim, chalrando para Jacintho, ella mostrava o seu lindo espanto por aquelle montão de telegrammas sobre a toalha."}, {"t": "p", "text": "— Tudo esta manhã, por causa da inundação?... Ah, Jacintho é hoje o homem, o unico homem de Paris! Muitas mulheres n’esses telegrammas?"}, {"t": "p", "text": "Languidamente, com o charuto a fumegar, o meu Principe empurrou para a sua amiga o telegramma do Gran-duque. Então Madame d’Oriol teve um ah! muito grave e muito sentido. Releu profundamente o papel de S. A. que os seus dedos acariciavam com uma reverencia gulosa. E sempre grave, sempre séria:"}, {"t": "p", "text": "— É brilhante!"}, {"t": "p", "text": "Oh, certamente! n’aquelle desastre tudo se passára com muito brilho, n’um tom muito Parisiense. E a deliciosa creatura não se podia demorar, porque fizera marcar um logar na egreja da Magdalena para o sermão!"}, {"t": "p", "text": "Jacintho exclamou com innocencia:"}, {"t": "p", "text": "— Sermão?... É já a estação dos sermões?"}, {"t": "p", "text": "Madame d’Oriol teve um movimento de carinhoso escandalo e dôr. O quê! pois nem na austera casa dos Trèves dera pela entrada da quaresma? De resto não se admirava — Jacintho era um turco! E, immediatamente celebrou o prégador, um frade dominicano, o Père Granon! Oh d’uma eloquencia! d’uma violencia! No derradeiro sermão prégara sobre o amor, a fragilidade dos amores mundanos! E tivera coisas d’uma inspiração, d’uma brutalidade! Depois que gesto, um gesto terrivel que esmagava, em que se lhe arregaçava toda a manga, mostrando o braço nú, um braço soberbo, muito branco, muito forte!"}, {"t": "p", "text": "O seu sorriso permanecia claro sob o olhar que negrejára dentro do véo negro. E Jacintho, rindo:"}, {"t": "p", "text": "— Um bom braço de director espiritual, hein? Para vergar, espancar almas..."}, {"t": "p", "text": "Ella acudiu:"}, {"t": "p", "text": "— Não! infelizmente o Père Granon não confessa!"}, {"t": "p", "text": "E de repente reconsiderou — aceitava um biscouto, um cálice de Tokai. Era necessario um cordial para affrontar as emoções do Père Granon! Ambos nos precipitáramos, um arrebatando a garrafa, outro offerecendo o prato de bonbons. Franzio o véo para os olhos, chupou á pressa um bolo que ensopára no Tokai. E como Jacintho, reparando casualmente no chapéo que ella trazia, se curvára com curiosidade, impressionado, Madame d’Oriol apagou o sorriso, toda seria, ante uma cousa seria:"}, {"t": "p", "text": "— Elegante, não é verdade?... É uma creação inteiramente nova de Madame Vial. Muito respeitoso, e muito suggestivo, agora na Quaresma."}, {"t": "p", "text": "O seu olhar, que me envolvera, tambem me convidava a admirar. Approximei o meu focinho de homem das serras para contemplar essa creação suprema do luxo de Quaresma. E era maravilhoso! Sobre o velludo, na sombra das plumas frizadas, aninhada entre rendas, fixada por um prégo, pousava delicadamente, feita de azeviche, uma Corôa de Espinhos!"}, {"t": "p", "text": "Ambos nos extasiamos. E Madame d’Oriol, n’um movimento e n’um sorriso que derramou mais aroma e mais claridade, abalou para a Magdalena."}, {"t": "p", "text": "O meu Principe arrastou pelo tapete alguns passos pensativos e molles. E bruscamente, levantando os hombros com uma determinação immensa, como se deslocasse um mundo:"}, {"t": "p", "text": "— Oh Zé Fernandes, vamos passar este Domingo n’alguma cousa simples e natural..."}, {"t": "p", "text": "— Em quê?"}, {"t": "p", "text": "Jacintho circumgirou os olhares muito abertos, como se, atravez da Vida Universal, procurasse anciosamente uma cousa natural e simples. Depois, descançando sobre mim os mesmos largos olhos que voltavam de muito longe, cançados e com pouca esperança:"}, {"t": "p", "text": "— Vamos ao Jardim das Plantas, vêr a girafa!"}]}]};

      const el = document.createElement(p.t === 'h' ? 'h3' : 'p');
      if (p.t === 'h'){ el.textContent = p.text; }
      else {
        for (const sent of p.text.split(SRE)){
          if (!sent.trim()) continue;
          const s = document.createElement('span'); s.className = 's';
          let last = 0, m;
          WRE.lastIndex = 0;
          while ((m = WRE.exec(sent)) !== null){
            s.appendChild(document.createTextNode(sent.slice(last, m.index)));
            const w = document.createElement('span');
            const lo = m[0].toLowerCase(), g = GLOSS[lo];
            if (g){ w.className = 'w'; w.dataset.o = m[0]; w.dataset.g = g; w.textContent = m[0]; }
            else { w.className = 'w x'; w.textContent = m[0]; }
            s.appendChild(w); last = m.index + m[0].length;
          }
          s.appendChild(document.createTextNode(sent.slice(last)));
          el.appendChild(s); el.appendChild(document.createTextNode(' '));
        }
      }
      main.appendChild(el);
    }
  }
}
main.addEventListener('click', e => {
  const w = e.target.closest('.w');
  if (!w || w.classList.contains('x')) return;
  const toG = !w.classList.contains('f');
  w.textContent = toG ? w.dataset.g : w.dataset.o;
  w.title = toG ? w.dataset.o : w.dataset.g;
  w.classList.toggle('f', toG);
});
main.addEventListener('dblclick', e => {
  const s = e.target.closest('.s');
  if (!s) return;
  const ws = s.querySelectorAll('.w:not(.x)');
  const anyOff = [...ws].some(w => !w.classList.contains('f'));
  ws.forEach(w => {
    w.textContent = anyOff ? w.dataset.g : w.dataset.o;
    w.title = anyOff ? w.dataset.o : w.dataset.g;
    w.classList.toggle('f', anyOff);
  });
});
document.getElementById('unflip').onclick = () =>
  document.querySelectorAll('.w.f').forEach(w => {
    w.textContent = w.dataset.o; w.title = w.dataset.g; w.classList.remove('f');
  });
const fsBtn = d => {
  let fs = parseFloat(localStorage.frFs || '1.15') + d * 0.12;
  fs = Math.min(1.9, Math.max(0.85, fs));
  document.body.style.fontSize = fs + 'rem'; localStorage.frFs = fs;
};
document.getElementById('fs-').onclick = () => fsBtn(-1);
document.getElementById('fs+').onclick = () => fsBtn(1);
const html = document.documentElement;
if (localStorage.frDk === '1') html.setAttribute('data-dk', '');
document.getElementById('dk').onclick = () => {
  const on = html.hasAttribute('data-dk');
  if (on) html.removeAttribute('data-dk'); else html.setAttribute('data-dk', '');
  localStorage.frDk = on ? '0' : '1';
};
let fsInit = localStorage.frFs;
if (fsInit) document.body.style.fontSize = fsInit + 'rem';
addEventListener('beforeunload', () => {
  localStorage.frPos = scrollY / Math.max(1, document.body.scrollHeight - innerHeight);
});
render();
if (localStorage.frPos) scrollTo(0, localStorage.frPos * (document.body.scrollHeight - innerHeight));
</script>
</body>
</html>
